<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>O'yinlar — VocabUZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#2196F3; --blue-deep:#1565C0; --blue-light:#E3F2FD; --blue-mid:#BBDEFB;
  --green:#22C55E; --green-light:#DCFCE7; --green-deep:#16A34A;
  --red:#EF4444; --red-light:#FEE2E2;
  --amber:#F59E0B; --amber-light:#FEF3C7;
  --purple:#8B5CF6; --purple-light:#EDE9FE;
  --ink:#1A1A2E; --ink-mid:#5A6070; --ink-soft:#9AA0AD;
  --white:#FFFFFF; --bg:#F0F6FF;
  --shadow-sm:0 1px 4px rgba(33,150,243,.10);
  --shadow-md:0 4px 16px rgba(33,150,243,.15);
  --radius:16px; --radius-sm:12px; --bottom-nav-h:66px;
}
html{min-height:100%;}
body{min-height:100%;background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);overflow-y:auto;}

/* ── TOP BAR ── */
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;gap:10px;}
.topbar-title{font-size:1.1rem;font-weight:800;flex:1;}
.topbar-badge{font-size:.75rem;font-weight:700;background:var(--blue-light);color:var(--blue);padding:4px 10px;border-radius:20px;}
.topbar-badge.green{background:var(--green-light);color:var(--green-deep);}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--bottom-nav-h);background:var(--white);display:flex;box-shadow:0 -1px 0 #e8eff8,0 -4px 16px rgba(33,150,243,.07);z-index:200;}
.bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-soft);font-size:.65rem;font-weight:600;text-decoration:none;-webkit-tap-highlight-color:transparent;}
.bottom-nav-item.is-active{color:var(--blue);}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--bottom-nav-h)+16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:24px;font-size:.83rem;font-weight:600;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap;z-index:500;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── SPINNER ── */
.spinner-wrap{display:flex;align-items:center;justify-content:center;padding:48px 0;}
.spinner{width:36px;height:36px;border:3px solid var(--blue-mid);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ════════════════════
   DASHBOARD
════════════════════ */
#viewDashboard{padding-bottom:calc(var(--bottom-nav-h)+20px);}

/* locked state */
.locked-hero{
  margin:16px 16px 20px;
  background:var(--white);
  border-radius:var(--radius);
  padding:28px 20px 24px;
  box-shadow:var(--shadow-sm);
  text-align:center;
}
.locked-icon{width:64px;height:64px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:var(--blue-light);border-radius:20px;}
.locked-icon svg{width:36px;height:36px;color:var(--blue-deep);}
.locked-title{font-size:1.15rem;font-weight:800;margin-bottom:6px;}
.locked-sub{font-size:.85rem;color:var(--ink-mid);line-height:1.6;margin-bottom:18px;}
.locked-prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.locked-prog-label{font-size:.8rem;font-weight:600;color:var(--ink-mid);}
.locked-prog-count{font-size:.8rem;font-weight:800;color:var(--blue);}
.locked-track{height:10px;background:var(--blue-light);border-radius:10px;overflow:hidden;margin-bottom:20px;}
.locked-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-deep));border-radius:10px;transition:width .5s ease;}
.btn-go-learn{
  width:100%;height:48px;border-radius:var(--radius-sm);border:none;cursor:pointer;
  font-family:inherit;font-size:.9rem;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--blue-deep),var(--blue));
  box-shadow:0 4px 14px rgba(33,150,243,.3);
}

/* unlocked hero */
.unlocked-hero{
  margin:16px 16px 4px;
  background:linear-gradient(135deg,#1565C0,#42A5F5);
  border-radius:var(--radius);
  padding:22px 20px;
  color:#fff;
  display:flex;align-items:center;gap:14px;
  box-shadow:0 4px 20px rgba(33,150,243,.35);
}
.unlocked-icon{width:52px;height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.2);border-radius:16px;}
.unlocked-icon svg{width:30px;height:30px;color:#fff;}
.unlocked-title{font-size:1.1rem;font-weight:800;margin-bottom:2px;}
.unlocked-sub{font-size:.82rem;opacity:.85;}

/* section header */
.section-hdr{padding:16px 16px 8px;font-size:.78rem;font-weight:700;color:var(--ink-soft);letter-spacing:.3px;text-transform:uppercase;}

/* game cards grid */
.games-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;}
@media(min-width:480px){.games-grid{grid-template-columns:1fr 1fr 1fr;}}
@media(min-width:720px){.games-grid{grid-template-columns:repeat(4,1fr);}}

.game-card{
  background:var(--white);border-radius:var(--radius);
  padding:16px 14px 14px;box-shadow:var(--shadow-sm);
  cursor:pointer;transition:box-shadow .15s,transform .12s;
  -webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column;gap:10px;
  position:relative;overflow:hidden;
}
.game-card:active{transform:scale(.97);box-shadow:var(--shadow-md);}
.game-card-icon{
  width:44px;height:44px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.game-card-icon svg{width:24px;height:24px;}
.game-card-name{font-size:.88rem;font-weight:800;color:var(--ink);line-height:1.3;}
.game-card-desc{font-size:.75rem;color:var(--ink-soft);line-height:1.4;flex:1;}
.game-card-start{
  height:32px;border-radius:10px;border:none;cursor:pointer;
  font-family:inherit;font-size:.75rem;font-weight:700;color:var(--blue);
  background:var(--blue-light);
  -webkit-tap-highlight-color:transparent;
  width:100%;
}
.game-card-start:active{background:var(--blue-mid);}

/* ════════════════════
   GAME SCREEN (shared)
════════════════════ */
.game-screen{
  display:none;
  position:fixed;inset:0;z-index:300;
  background:var(--bg);flex-direction:column;
  overflow:hidden;
}
.game-screen.open{display:flex;}

.g-topbar{
  display:flex;align-items:center;gap:10px;
  padding:14px 16px;background:var(--white);
  box-shadow:var(--shadow-sm);flex-shrink:0;
}
.g-back{width:36px;height:36px;border-radius:50%;background:var(--bg);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-mid);}
.g-title{font-size:.95rem;font-weight:700;flex:1;}
.g-score-pill{font-size:.8rem;font-weight:700;background:var(--blue-light);color:var(--blue);padding:4px 10px;border-radius:16px;}

.g-prog-track{height:4px;background:var(--blue-mid);flex-shrink:0;}
.g-prog-fill{height:100%;background:var(--blue);transition:width .3s;}

.g-body{flex:1;overflow-y:auto;padding:20px 16px calc(var(--bottom-nav-h)+20px);display:flex;flex-direction:column;align-items:center;gap:16px;}

/* word display card */
.g-word-card{
  width:100%;max-width:420px;
  background:linear-gradient(135deg,var(--blue-deep),var(--blue));
  border-radius:20px;padding:28px 22px;
  text-align:center;color:#fff;
}
.g-word-label{font-size:.72rem;font-weight:700;opacity:.7;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.g-word-main{font-size:2rem;font-weight:900;letter-spacing:-.5px;margin-bottom:4px;}
.g-word-sub{font-size:.82rem;opacity:.75;}

/* options */
.g-options{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;}
.g-opt{
  width:100%;padding:14px 18px;border-radius:var(--radius-sm);
  border:2px solid var(--blue-light);background:var(--white);
  font-family:inherit;font-size:.9rem;font-weight:600;color:var(--ink);
  cursor:pointer;text-align:left;transition:all .15s;
  -webkit-tap-highlight-color:transparent;
}
.g-opt:active:not([disabled]){background:var(--blue-light);}
.g-opt.correct{background:var(--green-light)!important;border-color:var(--green)!important;color:var(--green-deep)!important;}
.g-opt.wrong{background:var(--red-light)!important;border-color:var(--red)!important;color:var(--red)!important;}
.g-opt.show-correct{background:var(--green-light)!important;border-color:var(--green)!important;}
.g-opt[disabled]{cursor:default;}

/* next / submit buttons */
.g-next-btn{
  width:100%;max-width:420px;height:50px;
  border-radius:var(--radius);border:none;cursor:pointer;
  font-family:inherit;font-size:.95rem;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--blue-deep),var(--blue));
  box-shadow:0 4px 14px rgba(33,150,243,.3);
  display:none;
}
.g-next-btn.visible{display:block;}

/* text input */
.g-input-wrap{width:100%;max-width:420px;}
.g-input{
  width:100%;height:52px;padding:0 16px;
  border-radius:var(--radius-sm);border:2px solid var(--blue-mid);
  font-family:inherit;font-size:1rem;font-weight:600;color:var(--ink);
  background:var(--white);outline:none;
  transition:border-color .15s;
}
.g-input:focus{border-color:var(--blue);}
.g-input.correct-input{border-color:var(--green);background:var(--green-light);}
.g-input.wrong-input{border-color:var(--red);background:var(--red-light);}

/* feedback */
.g-feedback{
  width:100%;max-width:420px;
  padding:14px 16px;border-radius:var(--radius-sm);
  font-size:.88rem;font-weight:600;text-align:center;
  display:none;
}
.g-feedback.correct{background:var(--green-light);color:var(--green-deep);display:block;}
.g-feedback.wrong{background:var(--red-light);color:var(--red);display:block;}

/* ── RESULT SCREEN ── */
.g-result{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:32px 24px;text-align:center;gap:14px;
}
.g-result-icon{width:64px;height:64px;display:flex;align-items:center;justify-content:center;}
.g-result-icon svg{width:64px;height:64px;}
.g-result-title{font-size:1.3rem;font-weight:900;}
.g-result-sub{font-size:.88rem;color:var(--ink-mid);line-height:1.6;max-width:280px;}
.g-result-stats{display:flex;gap:10px;width:100%;max-width:340px;margin:4px 0;}
.grs{flex:1;background:var(--white);border-radius:14px;padding:14px 8px;box-shadow:var(--shadow-sm);text-align:center;}
.grs-val{font-size:1.5rem;font-weight:900;}
.grs-val.green{color:var(--green);}
.grs-val.red{color:var(--red);}
.grs-val.blue{color:var(--blue);}
.grs-lbl{font-size:.7rem;color:var(--ink-soft);margin-top:3px;}
.g-result-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;margin-top:4px;}
.grb{width:100%;height:50px;border-radius:var(--radius);border:none;cursor:pointer;font-family:inherit;font-size:.95rem;font-weight:700;-webkit-tap-highlight-color:transparent;}
.grb.primary{color:#fff;background:linear-gradient(135deg,var(--blue-deep),var(--blue));box-shadow:0 4px 14px rgba(33,150,243,.3);}
.grb.secondary{background:#F1F5F9;color:var(--ink-mid);}

/* ─────────────────────────
   HANGMAN
───────────────────────── */
.hm-letters-wrap{width:100%;max-width:420px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;}
.hm-slot{
  width:36px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  font-size:1.3rem;font-weight:800;color:var(--ink);
  border-bottom:3px solid var(--ink);padding-bottom:2px;
}
.hm-slot.space{border-bottom:none;width:16px;}
.hm-keyboard{width:100%;max-width:420px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;}
.hm-key{
  width:34px;height:34px;border-radius:10px;border:none;cursor:pointer;
  font-family:inherit;font-size:.82rem;font-weight:700;
  background:var(--white);color:var(--ink);
  box-shadow:var(--shadow-sm);
  -webkit-tap-highlight-color:transparent;
  transition:background .1s,color .1s;
}
.hm-key.used-correct{background:var(--green);color:#fff;}
.hm-key.used-wrong{background:var(--red-light);color:var(--red);}
.hm-key[disabled]{opacity:.4;cursor:default;}
.hm-body-svg{width:120px;height:120px;}
.hm-lives{display:flex;gap:6px;align-items:center;font-size:.82rem;font-weight:700;color:var(--ink-mid);}
.hm-heart{color:var(--red);display:inline-flex;align-items:center;}
.hm-heart svg{width:20px;height:20px;}
.hm-heart.lost{color:#ddd;}

/* ─────────────────────────
   WORD MATCH
───────────────────────── */
.match-grid{width:100%;max-width:420px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.match-col{display:flex;flex-direction:column;gap:8px;}
.match-item{
  padding:12px 14px;border-radius:var(--radius-sm);
  border:2px solid var(--blue-light);background:var(--white);
  font-size:.85rem;font-weight:700;cursor:pointer;text-align:center;
  transition:all .15s;-webkit-tap-highlight-color:transparent;
  min-height:46px;display:flex;align-items:center;justify-content:center;
}
.match-item.selected{border-color:var(--blue);background:var(--blue-light);color:var(--blue);}
.match-item.matched{border-color:var(--green);background:var(--green-light);color:var(--green-deep);cursor:default;}
.match-item.wrong-match{border-color:var(--red);background:var(--red-light);color:var(--red);}

/* ─────────────────────────
   WORD SCRAMBLE / SENTENCE
───────────────────────── */
.scramble-display{
  font-size:2rem;font-weight:900;color:var(--blue-deep);
  letter-spacing:.1em;text-align:center;
  padding:20px;background:var(--white);border-radius:var(--radius);
  width:100%;max-width:420px;box-shadow:var(--shadow-sm);
}
.sentence-words{width:100%;max-width:420px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.sentence-slot-area{width:100%;max-width:420px;min-height:56px;background:var(--white);border-radius:var(--radius-sm);border:2px dashed var(--blue-mid);display:flex;flex-wrap:wrap;gap:8px;padding:10px;align-items:center;}
.sentence-word{
  padding:8px 14px;border-radius:10px;border:none;cursor:pointer;
  font-family:inherit;font-size:.88rem;font-weight:700;
  background:var(--blue-light);color:var(--blue-deep);
  -webkit-tap-highlight-color:transparent;
  transition:opacity .15s;
}
.sentence-word.placed{opacity:.35;cursor:default;}
.sentence-placed{
  padding:7px 13px;border-radius:10px;border:none;cursor:pointer;
  font-family:inherit;font-size:.88rem;font-weight:700;
  background:var(--blue);color:#fff;
  -webkit-tap-highlight-color:transparent;
}

/* ─────────────────────────
   SPEED TYPING
───────────────────────── */
.timer-display{
  font-size:2.4rem;font-weight:900;color:var(--blue);
  text-align:center;
}
.timer-display.warning{color:var(--red);}

/* ─────────────────────────
   MISSING LETTERS
───────────────────────── */
.missing-slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:100%;max-width:420px;}
.ml-slot{
  width:40px;height:48px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;font-weight:800;
  background:var(--white);border:2px solid var(--blue-mid);
}
.ml-slot.given{border-color:var(--blue-light);color:var(--ink);}
.ml-slot.blank{border-color:var(--blue);color:var(--blue);border-style:dashed;}
.ml-slot.filled{border-color:var(--green);background:var(--green-light);color:var(--green-deep);}
.ml-keyboard{width:100%;max-width:420px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;}
.ml-key{
  min-width:34px;height:34px;padding:0 8px;
  border-radius:10px;border:none;cursor:pointer;
  font-family:inherit;font-size:.82rem;font-weight:700;
  background:var(--white);color:var(--ink);
  box-shadow:var(--shadow-sm);
  -webkit-tap-highlight-color:transparent;
}
.ml-key[disabled]{opacity:.4;cursor:default;}

/* ─────────────────────────
   TRUE / FALSE
───────────────────────── */
.tf-btns{width:100%;max-width:420px;display:flex;gap:12px;}
.tf-btn{
  flex:1;height:60px;border-radius:var(--radius-sm);border:none;cursor:pointer;
  font-family:inherit;font-size:1.1rem;font-weight:800;
  -webkit-tap-highlight-color:transparent;
  transition:all .15s;
}
.tf-btn.true{background:var(--green-light);color:var(--green-deep);}
.tf-btn.false{background:var(--red-light);color:var(--red);}
.tf-btn:active{transform:scale(.96);}
.tf-btn.correct{background:var(--green)!important;color:#fff!important;}
.tf-btn.wrong{background:var(--red)!important;color:#fff!important;}
.tf-btn[disabled]{cursor:default;}
/* ── ICON HELPERS ── */
.tf-btn-inner{display:flex;align-items:center;justify-content:center;gap:8px;}
.tf-btn-inner svg{width:22px;height:22px;flex-shrink:0;}
.g-feedback-inner{display:flex;align-items:center;justify-content:center;gap:8px;}
.g-feedback-inner svg{width:18px;height:18px;flex-shrink:0;}
.grb-inner{display:flex;align-items:center;justify-content:center;gap:8px;}
.grb-inner svg{width:18px;height:18px;flex-shrink:0;}
.match-item-inner{display:flex;align-items:center;justify-content:center;gap:6px;}
.match-item-inner svg{width:16px;height:16px;flex-shrink:0;}
.g-title-inner{display:flex;align-items:center;gap:8px;}
.g-title-inner svg{width:18px;height:18px;flex-shrink:0;}
.topbar-title-inner{display:flex;align-items:center;gap:8px;}
.topbar-title-inner svg{width:20px;height:20px;flex-shrink:0;}
.btn-go-learn-inner{display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-go-learn-inner svg{width:18px;height:18px;flex-shrink:0;}

/* ════════════════════════════════════════════════
   MOBILE RESPONSIVE — O'yinlar compact layout
   Applies at ≤ 480px (phones). Desktop unchanged.
════════════════════════════════════════════════ */
@media (max-width: 480px) {

  /* TOP BAR */
  .topbar {
    padding: 10px 12px 8px;
  }
  .topbar-title {
    font-size: .95rem;
  }
  .topbar-title-inner svg {
    width: 17px; height: 17px;
  }
  .topbar-badge {
    font-size: .68rem;
    padding: 3px 8px;
  }

  /* SECTION HEADER */
  .section-hdr {
    padding: 10px 12px 6px;
    font-size: .7rem;
  }

  /* LOCKED HERO */
  .locked-hero {
    margin: 10px 12px 14px;
    padding: 16px 14px 14px;
    border-radius: 14px;
  }
  .locked-icon {
    width: 44px; height: 44px;
    border-radius: 14px;
    margin-bottom: 8px;
  }
  .locked-icon svg {
    width: 24px; height: 24px;
  }
  .locked-title {
    font-size: .95rem;
    margin-bottom: 4px;
  }
  .locked-sub {
    font-size: .78rem;
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .locked-prog-row {
    margin-bottom: 6px;
  }
  .locked-prog-label,
  .locked-prog-count {
    font-size: .73rem;
  }
  .locked-track {
    height: 7px;
    margin-bottom: 12px;
  }
  .btn-go-learn {
    height: 40px;
    font-size: .82rem;
    border-radius: 10px;
  }
  .btn-go-learn-inner svg {
    width: 15px; height: 15px;
  }

  /* UNLOCKED HERO */
  .unlocked-hero {
    margin: 10px 12px 2px;
    padding: 14px 14px;
    border-radius: 14px;
    gap: 10px;
  }
  .unlocked-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
  }
  .unlocked-icon svg {
    width: 22px; height: 22px;
  }
  .unlocked-title {
    font-size: .9rem;
    margin-bottom: 1px;
  }
  .unlocked-sub {
    font-size: .75rem;
  }

  /* GAME CARDS GRID — keep 2 cols but make cards compact */
  .games-grid {
    gap: 8px;
    padding: 0 12px;
    grid-template-columns: 1fr 1fr;
  }

  .game-card {
    padding: 11px 10px 10px;
    gap: 7px;
    border-radius: 14px;
  }
  .game-card-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
  }
  .game-card-icon svg {
    width: 19px; height: 19px;
  }
  .game-card-name {
    font-size: .78rem;
    line-height: 1.25;
  }
  .game-card-desc {
    font-size: .68rem;
    line-height: 1.35;
  }
  .game-card-start {
    height: 28px;
    font-size: .68rem;
    border-radius: 8px;
  }

  /* BOTTOM PADDING for dashboard */
  #viewDashboard {

/* ════════════════════════════════
   STATE
════════════════════════════════ */
let ALL_WORDS   = [];   // Firestore'dan dinamik yuklanadi
const MIN_WORDS = 20;
let learnedIds  = [];
let currentUser = null;

/* ════════════════════════════════
   CORE HELPER
════════════════════════════════ */
function getLearnedVocabulary() {
  return ALL_WORDS.filter(w => learnedIds.includes(w.id));
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickN(arr, n) {
  return shuffle(arr).slice(0, n);
}

function getDistractors(correct, pool, key, count) {
  // pick `count` items from pool whose `key` differs from correct
  const others = pool.filter(w => w[key] !== correct[key]);
  return shuffle(others).slice(0, count);
}

function getUzDistractors(correct, pool, count) {
  const others = pool.filter(w => w.id !== correct.id);
  return shuffle(others).slice(0, count).map(w => w.uz.split(',')[0].trim());
}

/* ════════════════════════════════
   TOAST
════════════════════════════════ */
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ════════════════════════════════
   FIREBASE AUTH
════════════════════════════════ */
firebase.auth().onAuthStateChanged(function(user) {
  if (!user) { location.href = 'login.html'; return; }
  currentUser = user;
  // load localStorage first (tez ko'rsatish uchun)
  learnedIds = JSON.parse(localStorage.getItem('vz_learned') || '[]').map(Number);

  // Foydalanuvchi + BARCHA so'zlarni Firestore'dan parallel yuklaymiz
  Promise.all([
    db.collection('users').doc(user.uid).get(),
    db.collection('words').get()
  ]).then(function(results) {
    var userDoc   = results[0];
    var wordsSnap = results[1];

    // O'rganilgan so'zlar ID lari
    if (userDoc.exists && userDoc.data().learned) {
      learnedIds = userDoc.data().learned.map(Number);
      localStorage.setItem('vz_learned', JSON.stringify(learnedIds));
    }

    // Firestore so'zlar massivi — hardcoded emas, haqiqiy ma'lumot
    ALL_WORDS = wordsSnap.docs
      .map(function(d) {
        var data = d.data();
        var wId = (data.id != null && data.id !== '' && !isNaN(Number(data.id)))
          ? Number(data.id)
          : d.id;
        return Object.assign({}, data, { _docId: d.id, id: wId });
      })
      .filter(function(w) { return w.topic && w.word && w.uz; });

    renderDashboard();
  }).catch(function() { renderDashboard(); });
});

  if (e.key === 'vz_learned') {
    learnedIds = JSON.parse(e.newValue || '[]').map(Number);

});

/* ════════════════════════════════════════════════════
   GAME 1 — HANGMAN
════════════════════════════════════════════════════ */
let hmWord, hmGuessed, hmWrong, hmWords, hmIdx, hmScore = 0;
const HM_MAX = 6;

function startHangman() {
  const pool = getLearnedVocabulary();
  if (pool.length < 1) { showToast("O'rganilgan so'z yo'q!"); return; }
  hmWords  = shuffle(pool).slice(0, Math.min(10, pool.length));
  hmIdx    = 0;
  hmScore  = 0;
  openGame('gameHangman');
  hmNextWord();
}

function hmNextWord() {
  if (hmIdx >= hmWords.length) {
    // all done
    const body = document.getElementById('hmBody');
    body.dataset.restart = 'startHangman';
    body.dataset.game    = 'gameHangman';
    showResult(body, { correct: hmScore, wrong: hmWords.length - hmScore, total: hmWords.length });
    return;
  }
  hmWord    = hmWords[hmIdx].word.toLowerCase();
  hmGuessed = [];
  hmWrong   = [];
  document.getElementById('hmScore').textContent = hmScore + '/' + hmWords.length;
  hmRender();
}

function hmRender() {
  const body   = document.getElementById('hmBody');
  const hearts = Array.from({length: HM_MAX}, (_, i) =>
    `<span class="hm-heart${i >= (HM_MAX - hmWrong.length) ? '' : ' lost'}"><svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></span>`
  ).join('');

  // slots
  const slots = hmWord.split('').map(ch => {
    if (ch === ' ') return `<div class="hm-slot space"></div>`;
    const revealed = hmGuessed.includes(ch) ? ch.toUpperCase() : '';
    return `<div class="hm-slot">${revealed}</div>`;
  }).join('');

  // keyboard
  const alpha = 'abcdefghijklmnopqrstuvwxyz'.split('');
  const keys = alpha.map(c => {
    const used = hmGuessed.includes(c) || hmWrong.includes(c);
    const cls  = hmGuessed.includes(c) ? 'used-correct' : hmWrong.includes(c) ? 'used-wrong' : '';
    return `<button class="hm-key ${cls}" ${used?'disabled':''} onclick="hmGuess('${c}')">${c.toUpperCase()}</button>`;
  }).join('');

  const isComplete = hmWord.split('').filter(c => c !== ' ').every(c => hmGuessed.includes(c));
  const isDead     = hmWrong.length >= HM_MAX;

  let feedback = '';
  if (isComplete) {
    hmScore++;
    document.getElementById('hmScore').textContent = hmScore + '/' + hmWords.length;
    feedback = `<div class="g-feedback correct"><span class="g-feedback-inner"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>To'g'ri! "${hmWord}"</span></div>`;
    setTimeout(() => { hmIdx++; hmNextWord(); }, 1200);
  } else if (isDead) {
    feedback = `<div class="g-feedback wrong"><span class="g-feedback-inner"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>So'z: "${hmWord}"</span></div>`;
    setTimeout(() => { hmIdx++; hmNextWord(); }, 1800);
  }

  body.innerHTML = `
    <div class="g-word-card" style="padding:18px 22px;">
      <div class="g-word-label">So'zni toping</div>
      <div class="g-word-sub" style="opacity:.7;">${hmWords[hmIdx]?.uz?.split(',')[0] || ''}</div>
    </div>
    <div class="hm-lives">${hearts} <span style="margin-left:8px;font-size:.78rem;">${HM_MAX - hmWrong.length} urinish qoldi</span></div>
    <div class="hm-letters-wrap">${slots}</div>
    ${feedback}
    <div class="hm-keyboard">${keys}</div>`;
}

function hmGuess(ch) {
  if (hmGuessed.includes(ch) || hmWrong.includes(ch)) return;
  if (hmWord.includes(ch)) hmGuessed.push(ch);
  else hmWrong.push(ch);
  hmRender();
}

function startTranslation() {

}

function trRender() {

    showResult(body, { correct: trCorrect, wrong: trWrong, total: trWords.length });
    return;
  }

function trAnswer(btn, chosen, correct) {

/* ════════════════════════════════════════════════════
   GAME 3 — MAKE A SENTENCE
════════════════════════════════════════════════════ */
let snWords, snIdx, snCorrect, snWrong, snPlaced;

function startSentence() {
  const pool = getLearnedVocabulary().filter(w => w.example && w.example.length > 10);
  if (pool.length < 1) { showToast("Example mavjud so'zlar topilmadi!"); return; }
  snWords   = shuffle(pool).slice(0, Math.min(8, pool.length));
  snIdx     = 0; snCorrect = 0; snWrong = 0;
  openGame('gameSentence');
  snRender();
}

function snRender() {
  const body = document.getElementById('snBody');
  document.getElementById('snScore').textContent = snCorrect + '/' + snWords.length;
  document.getElementById('snProg').style.width  = (snIdx / snWords.length * 100) + '%';

  if (snIdx >= snWords.length) {
    body.dataset.restart = 'startSentence';
    body.dataset.game    = 'gameSentence';
    showResult(body, { correct: snCorrect, wrong: snWrong, total: snWords.length });
    return;
  }

  const w   = snWords[snIdx];
  const sentence = w.example.replace(/[.!?]$/, '').trim();
  const parts    = sentence.split(' ');
  const shuffled = shuffle([...parts]);
  snPlaced = [];

  body.innerHTML = `
    <div class="g-word-card">
      <div class="g-word-label">Gap tuzing</div>
      <div class="g-word-main" style="font-size:1.3rem">${w.word}</div>
      <div class="g-word-sub">Ushbu so'zni ishlating</div>
    </div>
    <div class="sentence-slot-area" id="snSlot">So'zlarni bu yerga bosing…</div>
    <div class="sentence-words" id="snWords">
      ${shuffled.map((wrd, i) => `<button class="sentence-word" id="snW-${i}" onclick="snPlace(${i},'${wrd.replace(/'/g,"\\'")}')">
        ${wrd}
      </button>`).join('')}
    </div>
    <div class="g-feedback" id="snFeedback"></div>
    <button class="g-next-btn" id="snCheck" onclick="snCheckAnswer('${sentence.replace(/'/g,"\\'")}')">Tekshirish</button>`;

  setTimeout(() => document.getElementById('snCheck').classList.add('visible'), 100);
}

function snPlace(idx, word) {
  const btn = document.getElementById('snW-' + idx);
  if (btn.classList.contains('placed')) {
    // remove from placed
    snPlaced = snPlaced.filter(p => p.idx !== idx);
    btn.classList.remove('placed');
  } else {
    snPlaced.push({ idx, word });
    btn.classList.add('placed');
  }
  const slot = document.getElementById('snSlot');
  if (snPlaced.length === 0) {
    slot.innerHTML = 'So\'zlarni bu yerga bosing…';
  } else {
    slot.innerHTML = snPlaced.map(p =>
      `<button class="sentence-placed" onclick="snRemove(${p.idx},'${p.word.replace(/'/g,"\\'")}')">
        ${p.word}
      </button>`
    ).join('');
  }
}

function snRemove(idx, word) {
  const btn = document.getElementById('snW-' + idx);
  if (btn) btn.classList.remove('placed');
  snPlaced = snPlaced.filter(p => p.idx !== idx);
  const slot = document.getElementById('snSlot');
  if (snPlaced.length === 0) slot.innerHTML = 'So\'zlarni bu yerga bosing…';
  else slot.innerHTML = snPlaced.map(p =>
    `<button class="sentence-placed" onclick="snRemove(${p.idx},'${p.word.replace(/'/g,"\\'")}')">
      ${p.word}
    </button>`
  ).join('');
}

function snCheckAnswer(correct) {
  const attempt = snPlaced.map(p => p.word).join(' ');
  const fb = document.getElementById('snFeedback');
  const ok = attempt.toLowerCase() === correct.toLowerCase();
  fb.className = 'g-feedback ' + (ok ? 'correct' : 'wrong');
  fb.innerHTML = ok
    ? '<span class="g-feedback-inner"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>To\'g\'ri!</span>'
    : '<span class="g-feedback-inner"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>To\'g\'ri gap: ' + correct + '</span>';
  if (ok) snCorrect++; else snWrong++;
  document.getElementById('snCheck').disabled = true;
  document.getElementById('snScore').textContent = snCorrect + '/' + snWords.length;
  setTimeout(() => { snIdx++; snRender(); }, 1600);
}

/* ════════════════════════════════════════════════════
   GAME 4 — WORD SCRAMBLE
════════════════════════════════════════════════════ */
let scWords, scIdx, scCorrect, scWrong;

function startScramble() {
  const pool = getLearnedVocabulary().filter(w => w.word.length > 3 && !w.word.includes(' '));
  if (pool.length < 1) { showToast("Mos so'zlar topilmadi!"); return; }
  scWords   = shuffle(pool).slice(0, Math.min(10, pool.length));
  scIdx     = 0; scCorrect = 0; scWrong = 0;
  openGame('gameScramble');
  scRender();
}

function scScramble(word) {
  let arr = word.split(''), s;
  do { s = shuffle(arr).join(''); } while (s === word && word.length > 1);
  return s;
}

function scRender() {
  const body = document.getElementById('scBody');
  document.getElementById('scScore').textContent = scCorrect + '/' + scWords.length;
  document.getElementById('scProg').style.width  = (scIdx / scWords.length * 100) + '%';

  if (scIdx >= scWords.length) {
    body.dataset.restart = 'startScramble';
    body.dataset.game    = 'gameScramble';
    showResult(body, { correct: scCorrect, wrong: scWrong, total: scWords.length });
    return;
  }

  const w = scWords[scIdx];
  body.innerHTML = `
    <div class="g-word-card">
      <div class="g-word-label">Bu so'zni toping</div>
      <div class="g-word-sub">${w.uz.split(',')[0]}</div>
    </div>
    <div class="scramble-display" id="scDisplay">${scScramble(w.word)}</div>
    <div class="g-input-wrap">
      <input class="g-input" id="scInput" placeholder="Javobingizni yozing…" autocomplete="off"
             onkeydown="if(event.key==='Enter') scCheck('${w.word.replace(/'/g,"\\'")}')">
    </div>
    <div class="g-feedback" id="scFeedback"></div>
    <button class="g-next-btn visible" onclick="scCheck('${w.word.replace(/'/g,"\\'")}')">Tekshirish</button>`;
  setTimeout(() => document.getElementById('scInput') && document.getElementById('scInput').focus(), 100);
}

function scCheck(correct) {
  const input = document.getElementById('scInput');
  const attempt = input.value.trim().toLowerCase();
  const ok = attempt === correct.toLowerCase();
  const fb = document.getElementById('scFeedback');
  fb.className = 'g-feedback ' + (ok ? 'correct' : 'wrong');
  fb.innerHTML = ok
    ? '<span class="g-feedback-inner"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>To\'g\'ri!</span>'
    : '<span class="g-feedback-inner"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>To\'g\'ri so\'z: ' + correct + '</span>';
  input.className = 'g-input ' + (ok ? 'correct-input' : 'wrong-input');
  input.disabled  = true;
  if (ok) scCorrect++; else scWrong++;
  document.getElementById('scScore').textContent = scCorrect + '/' + scWords.length;
  setTimeout(() => { scIdx++; scRender(); }, 1400);
}

/* ════════════════════════════════════════════════════
   GAME 5 — WORD MATCH
════════════════════════════════════════════════════ */
let mtWords, mtSelected, mtMatched, mtScore;

function startMatch() {
  const pool = getLearnedVocabulary();
  if (pool.length < 4) { showToast("Kamida 4 ta so'z o'rganing!"); return; }
  mtWords   = shuffle(pool).slice(0, Math.min(6, pool.length));
  mtSelected = null;
  mtMatched  = [];
  mtScore    = 0;
  openGame('gameMatch');
  mtRender();
}

function mtRender() {
  const body = document.getElementById('mtBody');
  const done = mtMatched.length === mtWords.length;

  if (done) {
    body.dataset.restart = 'startMatch';
    body.dataset.game    = 'gameMatch';
    showResult(body, { title:'Barcha juftlar topildi!', correct: mtScore, wrong: 0, total: mtWords.length });
    return;
  }

  document.getElementById('mtScore').textContent = mtMatched.length + '/' + mtWords.length;

  const leftWords  = [...mtWords];
  const rightWords = shuffle([...mtWords]);

  body.innerHTML = `
    <div class="g-word-card" style="padding:14px 20px;">
      <div class="g-word-label">Juftlarni toping</div>
      <div class="g-word-sub">Ingliz so'zini uzbek tarjimasiga ulang</div>
    </div>
    <div class="match-grid">
      <div class="match-col" id="mtLeft">
        ${leftWords.map(w => {
          const isMatched = mtMatched.includes(w.id);
          const checkSvg = '<svg aria-hidden="true" style="width:14px;height:14px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
          return `<div class="match-item${isMatched?' matched':''}" id="ml-${w.id}" onclick="mtClick('en','${w.id}')">
            <span class="match-item-inner">${isMatched ? checkSvg : ''}${w.word}</span>
          </div>`;
        }).join('')}
      </div>
      <div class="match-col" id="mtRight">
        ${rightWords.map(w => {
          const isMatched = mtMatched.includes(w.id);
          const checkSvg2 = '<svg aria-hidden="true" style="width:14px;height:14px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
          return `<div class="match-item${isMatched?' matched':''}" id="mr-${w.id}" onclick="mtClick('uz','${w.id}')">
            <span class="match-item-inner">${isMatched ? checkSvg2 : ''}${w.uz.split(',')[0].trim()}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

let mtSelSide = null, mtSelId = null;
function mtClick(side, id) {
  const numId = Number(id);
  if (mtMatched.includes(numId)) return;
  if (!mtSelSide) {
    mtSelSide = side; mtSelId = numId;
    const pfx = side === 'en' ? 'ml' : 'mr';
    document.getElementById(pfx + '-' + numId).classList.add('selected');
    return;
  }
  // second click
  const same = mtSelSide === side;
  if (same) {
    // deselect old, select new
    const oldPfx = mtSelSide === 'en' ? 'ml' : 'mr';
    const el = document.getElementById(oldPfx + '-' + mtSelId);
    if (el) el.classList.remove('selected');
    mtSelSide = side; mtSelId = numId;
    const pfx = side === 'en' ? 'ml' : 'mr';
    document.getElementById(pfx + '-' + numId).classList.add('selected');
    return;
  }
  // check match
  const enId = mtSelSide === 'en' ? mtSelId : numId;
  const uzId = mtSelSide === 'uz' ? mtSelId : numId;
  if (enId === uzId) {
    // correct
    mtMatched.push(enId); mtScore++;
    const ml = document.getElementById('ml-' + enId);
    const mr = document.getElementById('mr-' + enId);
    const checkSvgStr = '<svg aria-hidden="true" style="width:14px;height:14px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    if (ml) {
      ml.classList.remove('selected'); ml.classList.add('matched');
      const inner = ml.querySelector('.match-item-inner');
      if (inner && !inner.querySelector('svg')) inner.insertAdjacentHTML('afterbegin', checkSvgStr);
    }
    if (mr) {
      mr.classList.remove('selected'); mr.classList.add('matched');
      const inner = mr.querySelector('.match-item-inner');
      if (inner && !inner.querySelector('svg')) inner.insertAdjacentHTML('afterbegin', checkSvgStr);
    }
    document.getElementById('mtScore').textContent = mtMatched.length + '/' + mtWords.length;
    if (mtMatched.length === mtWords.length) {
      setTimeout(() => mtRender(), 600);
    }
  } else {
    // wrong
    const wrongId  = numId;
    const wrongPfx = side === 'en' ? 'ml' : 'mr';
    const oldPfx   = mtSelSide === 'en' ? 'ml' : 'mr';
    const wEl  = document.getElementById(wrongPfx + '-' + wrongId);
    const oEl  = document.getElementById(oldPfx + '-' + mtSelId);
    if (wEl) wEl.classList.add('wrong-match');
    if (oEl) { oEl.classList.remove('selected'); oEl.classList.add('wrong-match'); }
    setTimeout(() => {
      if (wEl) wEl.classList.remove('wrong-match');
      if (oEl) oEl.classList.remove('wrong-match');
    }, 700);
  }
  mtSelSide = null; mtSelId = null;
}

/* ════════════════════════════════════════════════════
   GAME 6 — CHOOSE CORRECT TRANSLATION (UZ → EN)
   GAME 9 — WORD QUIZ (same engine, different direction)
════════════════════════════════════════════════════ */
let chWords, chIdx, chCorrect, chWrong, chMode;

function startChoose() {
  chMode = 'choose';
  document.getElementById('chTitle').innerHTML = '<span class="g-title-inner"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>To\'g\'ri tarjima</span>';
  _startChooseEngine();
}
function startQuiz() {
  chMode = 'quiz';
  document.getElementById('chTitle').innerHTML = '<span class="g-title-inner"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>So\'z Kviz</span>';
  _startChooseEngine();
}

function _startChooseEngine() {
  const pool = getLearnedVocabulary();
  if (pool.length < 4) { showToast("Kamida 4 ta so'z o'rganing!"); return; }
  chWords   = shuffle(pool).slice(0, Math.min(10, pool.length));
  chIdx     = 0; chCorrect = 0; chWrong = 0;
  openGame('gameChoose');
  chRender();
}

function chRender() {
  const pool = getLearnedVocabulary();
  const body = document.getElementById('chBody');
  document.getElementById('chScore').textContent = chCorrect + '/' + chWords.length;
  document.getElementById('chProg').style.width  = (chIdx / chWords.length * 100) + '%';

  if (chIdx >= chWords.length) {
    body.dataset.restart = chMode === 'quiz' ? 'startQuiz' : 'startChoose';
    body.dataset.game    = 'gameChoose';
    showResult(body, { correct: chCorrect, wrong: chWrong, total: chWords.length });
    return;
  }

  const w = chWords[chIdx];
  if (chMode === 'choose') {
    // Show UZ → pick EN
    const distractors = pool.filter(x => x.id !== w.id);
    const opts = shuffle([w, ...shuffle(distractors).slice(0, 3)]);
    body.innerHTML = `
      <div class="g-word-card">
        <div class="g-word-label">Bu tarjimaning inglizchasi qaysi?</div>
        <div class="g-word-main" style="font-size:1.4rem">${w.uz.split(',')[0]}</div>
        <div class="g-word-sub">${w.topic}</div>
      </div>
      <div class="g-options">
        ${opts.map(o => `<button class="g-opt" onclick="chAnswer(this,${o.id},${w.id})">
          ${o.word}
        </button>`).join('')}
      </div>`;
  } else {
    // Quiz: show EN word → pick UZ
    const distractors = getUzDistractors(w, pool, 3);
    const correctUz   = w.uz.split(',')[0].trim();
    const opts        = shuffle([correctUz, ...distractors]);
    body.innerHTML = `
      <div class="g-word-card">
        <div class="g-word-label">Bu so'zning ma'nosi nima?</div>
        <div class="g-word-main">${w.word}</div>
        <div class="g-word-sub">${w.topic}</div>
      </div>
      <div class="g-options">
        ${opts.map(o => `<button class="g-opt" onclick="chAnswerUz(this,'${o.replace(/'/g,"\\'")}','${correctUz.replace(/'/g,"\\'")}')">
          ${o}
        </button>`).join('')}
      </div>`;
  }
}

function chAnswer(btn, chosenId, correctId) {
  document.querySelectorAll('#gameChoose .g-opt').forEach(b => b.disabled = true);
  if (chosenId === correctId) { btn.classList.add('correct'); chCorrect++; setTimeout(() => { chIdx++; chRender(); }, 900); }
  else {
    btn.classList.add('wrong'); chWrong++;
    document.querySelectorAll('#gameChoose .g-opt').forEach((b, i) => {
      if (Number(chWords[chIdx].id) === correctId) b.classList.add('show-correct');
    });
    setTimeout(() => { chIdx++; chRender(); }, 1400);
  }
  document.getElementById('chScore').textContent = chCorrect + '/' + chWords.length;
}

function chAnswerUz(btn, chosen, correct) {
  document.querySelectorAll('#gameChoose .g-opt').forEach(b => b.disabled = true);
  if (chosen === correct) { btn.classList.add('correct'); chCorrect++; setTimeout(() => { chIdx++; chRender(); }, 900); }
  else {
    btn.classList.add('wrong'); chWrong++;
    document.querySelectorAll('#gameChoose .g-opt').forEach(b => {
      if (b.textContent.trim() === correct) b.classList.add('show-correct');
    });
    setTimeout(() => { chIdx++; chRender(); }, 1400);
  }
  document.getElementById('chScore').textContent = chCorrect + '/' + chWords.length;
}

/* ════════════════════════════════════════════════════
   GAME 7 — MISSING LETTERS
════════════════════════════════════════════════════ */
let mlWords, mlIdx, mlCorrect, mlWrong, mlWordState, mlHidden;

function startMissing() {
  const pool = getLearnedVocabulary().filter(w => w.word.length >= 4 && !w.word.includes(' '));
  if (pool.length < 1) { showToast("Mos so'zlar topilmadi!"); return; }
  mlWords   = shuffle(pool).slice(0, Math.min(10, pool.length));
  mlIdx     = 0; mlCorrect = 0; mlWrong = 0;
  openGame('gameMissing');
  mlRender();
}

function mlRender() {
  const body = document.getElementById('mlBody');
  document.getElementById('mlScore').textContent = mlCorrect + '/' + mlWords.length;
  document.getElementById('mlProg').style.width  = (mlIdx / mlWords.length * 100) + '%';

  if (mlIdx >= mlWords.length) {
    body.dataset.restart = 'startMissing';
    body.dataset.game    = 'gameMissing';
    showResult(body, { correct: mlCorrect, wrong: mlWrong, total: mlWords.length });
    return;
  }

  const w    = mlWords[mlIdx];
  const word = w.word.toLowerCase();
  // hide ~40% of letters
  const totalChars  = word.length;
  const hideCount   = Math.max(1, Math.round(totalChars * 0.4));
  const indices     = shuffle([...Array(totalChars).keys()]).slice(0, hideCount);
  mlHidden          = indices;
  mlWordState       = word.split('').map((c, i) => indices.includes(i) ? '' : c);

  const slotsHtml = word.split('').map((c, i) => {
    if (indices.includes(i)) return `<div class="ml-slot blank" id="mls-${i}">_</div>`;
    return `<div class="ml-slot given">${c.toUpperCase()}</div>`;
  }).join('');

  // only show letters that are hidden
  const hiddenLetters = [...new Set(indices.map(i => word[i]))];
  const distractors   = 'abcdefghijklmnopqrstuvwxyz'.split('').filter(c => !hiddenLetters.includes(c));
  const keyset        = shuffle([...hiddenLetters, ...shuffle(distractors).slice(0, Math.max(0, 8 - hiddenLetters.length))]);

  const keysHtml = keyset.map(c =>
    `<button class="ml-key" onclick="mlGuess('${c}')">${c.toUpperCase()}</button>`
  ).join('');

  body.innerHTML = `
    <div class="g-word-card">
      <div class="g-word-label">Tushirilgan harflarni toping</div>
      <div class="g-word-sub">${w.uz.split(',')[0]}</div>
    </div>
    <div class="missing-slots">${slotsHtml}</div>
    <div class="g-feedback" id="mlFeedback"></div>
    <div class="ml-keyboard">${keysHtml}</div>`;
}

function mlGuess(ch) {
  // fill next blank slot that matches
  let filled = false;
  for (const i of mlHidden) {
    const slot = document.getElementById('mls-' + i);
    if (!slot) continue;
    if (mlWordState[i] === '' && mlWords[mlIdx].word[i].toLowerCase() === ch) {
      mlWordState[i] = ch;
      slot.textContent = ch.toUpperCase();
      slot.className   = 'ml-slot filled';
      filled = true;
      break;
    }
  }

  const isComplete = mlHidden.every(i => mlWordState[i] !== '');
  if (isComplete) {
    const correct = mlWordState.join('') === mlWords[mlIdx].word.toLowerCase();
    const fb = document.getElementById('mlFeedback');
    fb.className = 'g-feedback ' + (correct ? 'correct' : 'wrong');
    fb.innerHTML = correct
      ? '<span class="g-feedback-inner"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>To\'g\'ri!</span>'
      : '<span class="g-feedback-inner"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>To\'g\'ri so\'z: ' + mlWords[mlIdx].word + '</span>';
    if (correct) mlCorrect++; else mlWrong++;
    document.getElementById('mlScore').textContent = mlCorrect + '/' + mlWords.length;
    document.querySelectorAll('.ml-key').forEach(b => b.disabled = true);
    setTimeout(() => { mlIdx++; mlRender(); }, 1400);
  }
}

/* ════════════════════════════════════════════════════
   GAME 8 — SPEED TYPING
════════════════════════════════════════════════════ */
let spWords, spIdx, spCorrect, spWrong, speedTimer, spTimeLeft;
const SP_TIME = 10;

function startSpeed() {
  const pool = getLearnedVocabulary();
  if (pool.length < 1) { showToast("O'rganilgan so'z yo'q!"); return; }
  spWords   = shuffle(pool).slice(0, Math.min(10, pool.length));
  spIdx     = 0; spCorrect = 0; spWrong = 0;
  openGame('gameSpeed');
  spRender();
}

function spRender() {
  const body = document.getElementById('spBody');
  document.getElementById('spScore').textContent = spCorrect + '/' + spWords.length;
  document.getElementById('spProg').style.width  = (spIdx / spWords.length * 100) + '%';
  clearInterval(speedTimer);

  if (spIdx >= spWords.length) {
    body.dataset.restart = 'startSpeed';
    body.dataset.game    = 'gameSpeed';
    showResult(body, { correct: spCorrect, wrong: spWrong, total: spWords.length });
    return;
  }

  const w = spWords[spIdx];
  spTimeLeft = SP_TIME;

  body.innerHTML = `
    <div class="timer-display" id="spTimer">${spTimeLeft}</div>
    <div class="g-word-card">
      <div class="g-word-label">Bu so'zni yozing</div>
      <div class="g-word-main">${w.uz.split(',')[0]}</div>
      <div class="g-word-sub">Inglizcha</div>
    </div>
    <div class="g-input-wrap">
      <input class="g-input" id="spInput" placeholder="Yozing…" autocomplete="off"
             onkeydown="if(event.key==='Enter') spCheck('${w.word.replace(/'/g,"\\'")}')">
    </div>
    <div class="g-feedback" id="spFeedback"></div>
    <button class="g-next-btn visible" onclick="spCheck('${w.word.replace(/'/g,"\\'")}')">Tekshirish</button>`;

  setTimeout(() => document.getElementById('spInput') && document.getElementById('spInput').focus(), 50);

  speedTimer = setInterval(() => {
    spTimeLeft--;
    const timerEl = document.getElementById('spTimer');
    if (timerEl) {
      timerEl.textContent = spTimeLeft;
      timerEl.className = 'timer-display' + (spTimeLeft <= 3 ? ' warning' : '');
    }
    if (spTimeLeft <= 0) {
      clearInterval(speedTimer);
      spTimeExpired(w.word);
    }
  }, 1000);
}

function spCheck(correct) {
  clearInterval(speedTimer);
  const input = document.getElementById('spInput');
  if (!input) return;
  const attempt = input.value.trim().toLowerCase();
  const ok      = attempt === correct.toLowerCase();
  const fb      = document.getElementById('spFeedback');
  fb.className  = 'g-feedback ' + (ok ? 'correct' : 'wrong');
  fb.innerHTML = ok
    ? '<span class="g-feedback-inner"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>To\'g\'ri! +1</span>'
    : '<span class="g-feedback-inner"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>To\'g\'ri so\'z: ' + correct + '</span>';
  input.disabled = true;
  if (ok) spCorrect++; else spWrong++;
  document.getElementById('spScore').textContent = spCorrect + '/' + spWords.length;
  setTimeout(() => { spIdx++; spRender(); }, 1200);
}

function spTimeExpired(correct) {
  const input = document.getElementById('spInput');
  if (input) input.disabled = true;
  const fb = document.getElementById('spFeedback');
  if (fb) { fb.className = 'g-feedback wrong'; fb.innerHTML = '<span class="g-feedback-inner"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Vaqt tugadi! To\'g\'ri: ' + correct + '</span>'; }
  spWrong++;
  document.getElementById('spScore').textContent = spCorrect + '/' + spWords.length;
  setTimeout(() => { spIdx++; spRender(); }, 1600);
}

/* ════════════════════════════════════════════════════
   GAME 10 — TRUE OR FALSE
════════════════════════════════════════════════════ */
let tfWords, tfIdx, tfCorrect, tfWrong;

function startTF() {
  const pool = getLearnedVocabulary();
  if (pool.length < 2) { showToast("Kamida 2 ta so'z o'rganing!"); return; }
  tfWords   = shuffle(pool).slice(0, Math.min(12, pool.length));
  tfIdx     = 0; tfCorrect = 0; tfWrong = 0;
  openGame('gameTF');
  tfRender();
}

function tfRender() {
  const pool = getLearnedVocabulary();
  const body = document.getElementById('tfBody');
  document.getElementById('tfScore').textContent = tfCorrect + '/' + tfWords.length;
  document.getElementById('tfProg').style.width  = (tfIdx / tfWords.length * 100) + '%';

  if (tfIdx >= tfWords.length) {
    body.dataset.restart = 'startTF';
    body.dataset.game    = 'gameTF';
    showResult(body, { correct: tfCorrect, wrong: tfWrong, total: tfWords.length });
    return;
  }

  const w        = tfWords[tfIdx];
  const isTrue   = Math.random() > 0.4; // 60% true
  let displayUz;
  if (isTrue) {
    displayUz = w.uz.split(',')[0].trim();
  } else {
    const others  = pool.filter(x => x.id !== w.id);
    const wrongW  = shuffle(others)[0];
    displayUz     = wrongW ? wrongW.uz.split(',')[0].trim() : w.uz.split(',')[0].trim();
  }

  body.innerHTML = `
    <div class="g-word-card">
      <div class="g-word-label">Bu to'g'rimi?</div>
      <div class="g-word-main">${w.word}</div>
      <div class="g-word-sub">= "${displayUz}"</div>
    </div>
    <div class="g-feedback" id="tfFeedback"></div>
    <div class="tf-btns">
      <button class="tf-btn true" onclick="tfAnswer(this, true, ${isTrue})">
        <span class="tf-btn-inner">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          To'g'ri
        </span>
      </button>
      <button class="tf-btn false" onclick="tfAnswer(this, false, ${!isTrue})">
        <span class="tf-btn-inner">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Noto'g'ri
        </span>
      </button>
    </div>`;
}

function tfAnswer(btn, userChoice, isCorrect) {
  document.querySelectorAll('#gameTF .tf-btn').forEach(b => b.disabled = true);
  const fb = document.getElementById('tfFeedback');
  if (isCorrect) {
    btn.classList.add('correct');
    fb.className = 'g-feedback correct'; fb.innerHTML = '<span class="g-feedback-inner"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>To\'g\'ri!</span>';
    tfCorrect++;
  } else {
    btn.classList.add('wrong');
    fb.className = 'g-feedback wrong'; fb.innerHTML = '<span class="g-feedback-inner"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Noto\'g\'ri!</span>';
    tfWrong++;
  }
  document.getElementById('tfScore').textContent = tfCorrect + '/' + tfWords.length;
  setTimeout(() => { tfIdx++; tfRender(); }, 1100);
}
