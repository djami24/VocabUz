<html lang="uz">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --blue:#2196F3;
  --blue-deep:#1565C0;
  --blue-light:#E3F2FD;
  --blue-mid:#BBDEFB;
  --green:#22C55E;
  --green-light:#DCFCE7;
  --red:#EF4444;
  --red-light:#FEE2E2;
  --amber:#F59E0B;
  --ink:#1A1A2E;
  --ink-mid:#5A6070;
  --ink-soft:#9AA0AD;
  --white:#FFFFFF;
  --bg:#F0F6FF;
  --shadow-sm:0 1px 4px rgba(33,150,243,.10);
  --shadow-md:0 4px 16px rgba(33,150,243,.15);
  --radius:16px;
  --radius-sm:12px;
  --bottom-nav-h:66px;
}

html,body{min-height:100%;background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);}

/* ── TOP BAR ── */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--bg);
  padding:14px 16px 10px;
  display:flex;align-items:center;gap:10px;
}
.back-btn{
  width:38px;height:38px;border-radius:50%;
  background:var(--white);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);color:var(--ink-mid);flex-shrink:0;
}
.topbar-title{font-size:1.05rem;font-weight:700;flex:1;}
.topbar-count{
  font-size:.78rem;font-weight:600;
  background:var(--blue-light);color:var(--blue);
  padding:4px 10px;border-radius:20px;
}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  height:var(--bottom-nav-h);
  background:var(--white);
  display:flex;
  box-shadow:0 -1px 0 #e8eff8,0 -4px 16px rgba(33,150,243,.07);
  z-index:200;
}
.bottom-nav-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;
  color:var(--ink-soft);font-size:.65rem;font-weight:600;
  text-decoration:none;-webkit-tap-highlight-color:transparent;
}
.bottom-nav-item.is-active{color:var(--blue);}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:calc(var(--bottom-nav-h)+16px);left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;
  padding:10px 20px;border-radius:24px;
  font-size:.83rem;font-weight:600;
  pointer-events:none;opacity:0;
  transition:opacity .25s,transform .25s;
  white-space:nowrap;z-index:300;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── MAIN CONTENT ── */
.page{padding:0 0 calc(var(--bottom-nav-h)+20px);}

/* ── EMPTY STATE ── */
.empty-state{
  display:flex;flex-direction:column;align-items:center;
  padding:60px 24px;gap:16px;color:var(--ink-soft);text-align:center;
}
.empty-icon{
  width:80px;height:80px;border-radius:50%;
  background:var(--blue-light);
  display:flex;align-items:center;justify-content:center;
}
.empty-title{font-size:1rem;font-weight:700;color:var(--ink);}
.empty-sub{font-size:.85rem;line-height:1.5;max-width:240px;}
.empty-btn{
  padding:13px 32px;border-radius:24px;border:none;cursor:pointer;
  font-family:inherit;font-size:.95rem;font-weight:700;
  color:#fff;background:var(--blue);
  box-shadow:0 4px 12px rgba(33,150,243,.3);
}

/* ── FILTER TABS ── */
.filter-wrap{
  display:flex;gap:8px;padding:0 16px 14px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.filter-wrap::-webkit-scrollbar{display:none;}
.filter-pill{
  flex-shrink:0;padding:7px 16px;border-radius:20px;
  font-size:.8rem;font-weight:600;
  background:var(--white);color:var(--ink-mid);
  border:none;cursor:pointer;box-shadow:var(--shadow-sm);
  transition:background .15s,color .15s;
}
.filter-pill.active{background:var(--blue);color:#fff;}

/* ── DECK CARD (list view) ── */
.deck-list{
  display:flex;flex-direction:column;gap:10px;
  padding:0 16px;
}
.deck-card{
  background:var(--white);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow-sm);
  cursor:pointer;transition:box-shadow .15s,transform .12s;
  -webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;gap:14px;
}
.deck-card:active{transform:scale(.98);box-shadow:var(--shadow-md);}
.deck-icon{
  width:48px;height:48px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;flex-shrink:0;
}
.deck-info{flex:1;}
.deck-title{font-size:.97rem;font-weight:700;color:var(--ink);margin-bottom:3px;}
.deck-sub{font-size:.78rem;color:var(--ink-soft);}
.deck-progress{
  font-size:.78rem;font-weight:700;
  background:var(--blue-light);color:var(--blue);
  padding:3px 10px;border-radius:20px;flex-shrink:0;
}
.deck-arrow{color:var(--ink-soft);}

/* ── STATS ROW ── */
.stats-row{
  display:flex;gap:10px;padding:0 16px 16px;
}
.stat-box{
  flex:1;background:var(--white);border-radius:var(--radius-sm);
  padding:12px 10px;text-align:center;box-shadow:var(--shadow-sm);
}
.stat-num{font-size:1.5rem;font-weight:800;color:var(--blue);}
.stat-lbl{font-size:.72rem;color:var(--ink-soft);margin-top:2px;}

/* ── SPINNER ── */
.spinner-wrap{display:flex;align-items:center;justify-content:center;padding:48px 0;}
.spinner{
  width:36px;height:36px;
  border:3px solid var(--blue-mid);border-top-color:var(--blue);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════════════════════════════════════════════
   FLASHCARD FULLSCREEN SCREEN
══════════════════════════════════════════════ */
.fc-screen{
  position:fixed;inset:0;z-index:500;
  background:var(--bg);
  display:none;flex-direction:column;
}
.fc-screen.open{display:flex;}

/* Top bar */
.fc-topbar{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;background:var(--white);
  box-shadow:var(--shadow-sm);flex-shrink:0;
}
.fc-close{
  width:36px;height:36px;border-radius:50%;
  background:var(--bg);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-mid);flex-shrink:0;
}
.fc-title{font-size:.95rem;font-weight:700;flex:1;}
.fc-counter{font-size:.82rem;font-weight:700;color:var(--blue);}

/* Progress bar */
.fc-progress-bar{height:4px;background:var(--blue-mid);flex-shrink:0;}
.fc-progress-fill{height:100%;background:var(--blue);transition:width .35s ease;}

/* Body */
.fc-body{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:20px 16px 16px;overflow:hidden;
}

/* Flip card */
.fc-card-wrap{
  width:100%;max-width:380px;
  perspective:1000px;cursor:pointer;
  margin-bottom:24px;
}
.fc-card{
  width:100%;height:240px;
  position:relative;transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.4,0,.2,1);
  border-radius:22px;
}
.fc-card.flipped{transform:rotateY(180deg);}
.fc-face{
  position:absolute;inset:0;border-radius:22px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px;backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}
.fc-front{
  background:linear-gradient(135deg,var(--blue-deep),var(--blue));
  color:#fff;
}
.fc-back{background:var(--white);box-shadow:var(--shadow-md);transform:rotateY(180deg);}

.fc-front-level{
  font-size:.72rem;font-weight:700;
  background:rgba(255,255,255,.2);
  padding:3px 10px;border-radius:8px;
  margin-bottom:14px;
}
.fc-front-word{font-size:2rem;font-weight:900;text-align:center;margin-bottom:8px;}
.fc-front-topic{font-size:.78rem;opacity:.75;text-align:center;}
.fc-hint{
  font-size:.75rem;opacity:.65;
  display:flex;align-items:center;gap:4px;margin-top:14px;
}

.fc-back-uz{
  font-size:1.25rem;font-weight:800;
  color:var(--ink);text-align:center;margin-bottom:8px;
}
.fc-back-level{
  display:inline-block;
  background:var(--blue-light);color:var(--blue);
  font-size:.72rem;font-weight:700;
  padding:3px 10px;border-radius:8px;margin-bottom:12px;
}
.fc-back-example{
  font-size:.82rem;font-style:italic;
  color:var(--ink-mid);text-align:center;
  line-height:1.5;
}

/* Tap hint */
.fc-tap-hint{
  font-size:.8rem;color:var(--ink-soft);
  margin-bottom:20px;
  display:flex;align-items:center;gap:5px;
}

/* Answer buttons */
.fc-btns{display:flex;gap:10px;width:100%;max-width:380px;}
.fc-btn{
  flex:1;height:52px;border-radius:16px;border:none;cursor:pointer;
  font-family:inherit;font-size:.88rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .1s,opacity .15s;-webkit-tap-highlight-color:transparent;
}
.fc-btn:active{transform:scale(.96);}
.fc-btn.again{background:var(--red-light);color:var(--red);}
.fc-btn.skip{background:#F1F5F9;color:var(--ink-soft);}
.fc-btn.good{background:var(--green-light);color:var(--green);}

/* Result screen */
.fc-result{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:32px 24px;text-align:center;gap:12px;
}
.fc-result-emoji{font-size:4rem;margin-bottom:4px;}
.fc-result-title{font-size:1.3rem;font-weight:900;color:var(--ink);}
.fc-result-sub{font-size:.9rem;color:var(--ink-mid);line-height:1.5;max-width:260px;}
.fc-result-stats{display:flex;gap:12px;margin:16px 0;width:100%;max-width:320px;}
.fc-stat{
  flex:1;background:var(--white);border-radius:14px;
  padding:14px 10px;box-shadow:var(--shadow-sm);
}
.fc-stat-val{font-size:1.5rem;font-weight:900;}
.fc-stat-val.green{color:var(--green);}
.fc-stat-val.red{color:var(--red);}
.fc-stat-val.ink{color:var(--ink-mid);}
.fc-stat-lbl{font-size:.72rem;color:var(--ink-soft);margin-top:3px;}
.fc-result-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;margin-top:4px;}
.fc-result-btn{
  width:100%;height:50px;border-radius:16px;border:none;cursor:pointer;
  font-family:inherit;font-size:.97rem;font-weight:700;
  transition:opacity .15s;-webkit-tap-highlight-color:transparent;
}
.fc-result-btn:active{opacity:.8;}
.fc-result-btn.primary{color:#fff;background:var(--blue);box-shadow:0 4px 14px rgba(33,150,243,.3);}
.fc-result-btn.secondary{background:#F1F5F9;color:var(--ink-mid);}
</style>
</head>

// Topic emoji map
const TOPIC_EMOJI = {
  "Ta'lim":'📚', "Sog'liq":'🏥', "Biznes":'💼',
  "Hissiyotlar":'😊', "Munosabatlar":'🤝',
  "Texnologiya":'💻', "Atrof-muhit":'🌿', "Ovqat":'🍽️'
};

// ── STATE ──────────────────────────────────────────────────
let learnedIds  = [];
let currentUser = null;
let activeFilter = 'Hammasi';

// ── FLASHCARD ENGINE ──────────────────────────────────────
let fcWords   = [];
let fcIndex   = 0;
let fcFlipped = false;
let fcGood    = 0;
let fcAgain   = 0;
let fcSkip    = 0;
let fcDeckName = '';

// ── FIREBASE AUTH ─────────────────────────────────────────
firebase.auth().onAuthStateChanged(function(user){
  if(!user){ location.href='login.html'; return; }
  currentUser = user;

  db.collection('users').doc(user.uid).get().then(function(doc){
    document.getElementById('loader').style.display = 'none';
    if(doc.exists && doc.data().learned){
      learnedIds = doc.data().learned.map(function(x){ return Number(x); });
    }
    // Sync localStorage
    localStorage.setItem('vz_learned', JSON.stringify(learnedIds));
    renderMain();
  }).catch(function(){
    document.getElementById('loader').style.display = 'none';
    learnedIds = JSON.parse(localStorage.getItem('vz_learned') || '[]').map(Number);
    renderMain();
  });
});

// ── RENDER MAIN PAGE ──────────────────────────────────────
function renderMain(){
  const total = learnedIds.length;
  document.getElementById('totalCount').textContent = total + ' ta so\'z';

  const page = document.getElementById('mainPage');

  if(total === 0){
    page.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2196F3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M8 10h8M8 14h5"/></svg>
        </div>
        <div class="empty-title">Hali so'z o'rganilmagan</div>
        <div class="empty-sub">Topic vocabulary sahifasida so'zlar yonidagi ✅ <strong>Urgandim</strong> tugmasini bosib boshlang!</div>
        <button class="empty-btn" onclick="location.href='topic.html'">So'zlarga o'tish →</button>
      </div>`;
    return;
  }

  // Group by topic
  const topicMap = {};
  learnedIds.forEach(function(id){
    const w = ALL_WORDS.find(function(x){ return x.id === id; });
    if(!w) return;
    if(!topicMap[w.topic]) topicMap[w.topic] = [];
    topicMap[w.topic].push(w);
  });

  const topics = Object.keys(topicMap);
  const allLearned = ALL_WORDS.filter(function(w){ return learnedIds.includes(w.id); });

  // Stats row
  let html = `
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num">${total}</div>
        <div class="stat-lbl">Jami o'rganilgan</div>
      </div>
      <div class="stat-box">
        <div class="stat-num">${topics.length}</div>
        <div class="stat-lbl">Mavzu</div>
      </div>
      <div class="stat-box">
        <div class="stat-num">${Math.round(total/200*100)}%</div>
        <div class="stat-lbl">200 dan</div>
      </div>
    </div>`;

  // Filter pills
  html += '<div class="filter-wrap" id="filterWrap">';
  html += `<button class="filter-pill${activeFilter==='Hammasi'?' active':''}" onclick="setFilter('Hammasi')">Hammasi (${total})</button>`;
  topics.forEach(function(t){
    html += `<button class="filter-pill${activeFilter===t?' active':''}" onclick="setFilter('${t}')">${TOPIC_EMOJI[t]||''} ${t} (${topicMap[t].length})</button>`;
  });
  html += '</div>';

  // Deck cards
  html += '<div class="deck-list">';

  // "Hammasi" deck
  if(activeFilter === 'Hammasi'){
    html += `
      <div class="deck-card" onclick="startFC(null,'Barcha so\\'zlar')">
        <div class="deck-icon" style="background:#E3F2FD;">🃏</div>
        <div class="deck-info">
          <div class="deck-title">Barcha o'rganilgan so'zlar</div>
          <div class="deck-sub">Aralash tartibda • Barcha mavzular</div>
        </div>
        <div class="deck-progress">${total} ta</div>
        <svg class="deck-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </div>`;
    topics.forEach(function(t){
      const cnt = topicMap[t].length;
      html += `
        <div class="deck-card" onclick="startFC('${t}','${(TOPIC_EMOJI[t]||'')+' '+t}')">
          <div class="deck-icon" style="background:#F0F6FF;font-size:1.6rem;">${TOPIC_EMOJI[t]||'📖'}</div>
          <div class="deck-info">
            <div class="deck-title">${t}</div>
            <div class="deck-sub">${cnt} ta so'z o'rganilgan</div>
          </div>
          <div class="deck-progress">${cnt} ta</div>
          <svg class="deck-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </div>`;
    });
  } else {
    // Filtered topic
    const filtered = topicMap[activeFilter] || [];
    html += `
      <div class="deck-card" onclick="startFC('${activeFilter}','${(TOPIC_EMOJI[activeFilter]||'')+' '+activeFilter}')">
        <div class="deck-icon" style="background:#F0F6FF;font-size:1.6rem;">${TOPIC_EMOJI[activeFilter]||'📖'}</div>
        <div class="deck-info">
          <div class="deck-title">${activeFilter} — barcha kartochkalar</div>
          <div class="deck-sub">${filtered.length} ta so'z</div>
        </div>
        <div class="deck-progress">${filtered.length} ta</div>
        <svg class="deck-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </div>`;
    // Individual level groups within topic
    const levels = {};
    filtered.forEach(function(w){
      if(!levels[w.level]) levels[w.level] = [];
      levels[w.level].push(w);
    });
    Object.keys(levels).sort().forEach(function(lv){
      const cnt = levels[lv].length;
      html += `
        <div class="deck-card" onclick="startFCWords(${JSON.stringify(levels[lv].map(function(w){return w.id;}))}, '${activeFilter} · ${lv}')">
          <div class="deck-icon" style="background:#FEF3C7;font-size:1rem;font-weight:900;color:#B45309;">${lv}</div>
          <div class="deck-info">
            <div class="deck-title">${lv} darajasi</div>
            <div class="deck-sub">${cnt} ta so'z</div>
          </div>
          <div class="deck-progress">${cnt} ta</div>
          <svg class="deck-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </div>`;
    });
  }

  html += '</div>';
  page.innerHTML = html;
}

function setFilter(f){
  activeFilter = f;
  renderMain();
}

// ── START FLASHCARDS ──────────────────────────────────────
function startFC(topic, title){
  let words;
  if(!topic){
    words = ALL_WORDS.filter(function(w){ return learnedIds.includes(w.id); });
  } else {
    words = ALL_WORDS.filter(function(w){ return learnedIds.includes(w.id) && w.topic === topic; });
  }
  if(!words.length){ showToast('So\'z yo\'q!'); return; }
  launchFC(words, title);
}

function startFCWords(ids, title){
  const words = ALL_WORDS.filter(function(w){ return ids.includes(w.id); });
  launchFC(words, title);
}

function launchFC(words, title){
  // Shuffle
  fcWords  = words.slice().sort(function(){ return Math.random() - .5; });
  fcIndex  = 0;
  fcGood   = 0;
  fcAgain  = 0;
  fcSkip   = 0;
  fcFlipped = false;
  fcDeckName = title;

  document.getElementById('fcTitle').textContent = title;
  document.getElementById('fcResult').style.display = 'none';
  document.getElementById('fcBody').style.display   = 'flex';
  document.getElementById('fcScreen').classList.add('open');
  showFCCard();
}

function showFCCard(){
  const w = fcWords[fcIndex];
  if(!w) return;
  fcFlipped = false;
  document.getElementById('fcCard').classList.remove('flipped');
  document.getElementById('fcTapHint').style.display = 'flex';

  document.getElementById('fcLevel').textContent    = w.level;
  document.getElementById('fcWord').textContent     = w.word;
  document.getElementById('fcTopic').textContent    = (TOPIC_EMOJI[w.topic]||'') + ' ' + w.topic;
  document.getElementById('fcUz').textContent       = w.uz;
  document.getElementById('fcLevelBack').textContent= w.level + ' · ' + w.topic;
  document.getElementById('fcExample').textContent  = w.example || '';

  const total = fcWords.length;
  const cur   = fcIndex + 1;
  document.getElementById('fcCounter').textContent = cur + '/' + total;
  document.getElementById('fcFill').style.width    = (cur/total*100) + '%';
}

function flipCard(){
  fcFlipped = !fcFlipped;
  document.getElementById('fcCard').classList.toggle('flipped', fcFlipped);
  if(fcFlipped){
    document.getElementById('fcTapHint').style.display = 'none';
  }
}

function fcAnswer(type){
  if(!fcFlipped){ flipCard(); showToast('Avval kartochkani aylantiring 👆'); return; }
  if(type==='good')  fcGood++;
  if(type==='again') fcAgain++;
  if(type==='skip')  fcSkip++;
  fcIndex++;
  if(fcIndex >= fcWords.length){ showFCResult(); }
  else { showFCCard(); }
}

function showFCResult(){
  document.getElementById('fcBody').style.display   = 'none';
  document.getElementById('fcResult').style.display = 'flex';
  const total = fcWords.length;
  const pct   = Math.round(fcGood/total*100);
  let emoji='🎉', title='Barakalla!';
  if(pct===100){ emoji='🏆'; title='Mukammal natija!'; }
  else if(pct>=70){ emoji='🎉'; title='Yaxshi natija!'; }
  else if(pct>=40){ emoji='💪'; title='Davom eting!'; }
  else { emoji='📚'; title='Ko\'proq mashq kerak'; }
  document.getElementById('fcEmoji').textContent   = emoji;
  document.getElementById('fcResTitle').textContent= title;
  document.getElementById('fcResSub').textContent  = total+' ta so\'zdan '+fcGood+' tasini bildingiz ('+pct+'%)';
  document.getElementById('fcGoodN').textContent   = fcGood;
  document.getElementById('fcAgainN').textContent  = fcAgain;
  document.getElementById('fcSkipN').textContent   = fcSkip;
  document.getElementById('fcFill').style.width    = '100%';
}

function restartFC(){
  fcWords = fcWords.slice().sort(function(){ return Math.random()-.5; });
  fcIndex = fcGood = fcAgain = fcSkip = 0;
  document.getElementById('fcResult').style.display = 'none';
  document.getElementById('fcBody').style.display   = 'flex';
  showFCCard();
}

function closeFC(){
  document.getElementById('fcScreen').classList.remove('open');
}

// ── TOAST ─────────────────────────────────────────────────
let toastTimer;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

// ── REAL-TIME LISTEN: topic.html "Urgandim" bosishni ushlaydi ──
// localStorage eventini listen qilamiz (boshqa tab)
window.addEventListener('storage', function(e){
  if(e.key === 'vz_learned'){
    learnedIds = JSON.parse(e.newValue || '[]').map(Number);
    renderMain();
  }
});
</script>
