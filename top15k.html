<body>

    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" type="search" placeholder="Qidirish" id="topSearch" oninput="filterTop()">

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
var allWords = [];
var lastDoc  = null;
var PAGE_SIZE = 50;

firebase.auth().onAuthStateChanged(function(user){
  if(!user){ location.href='login.html'; return; }
  loadWords();
});

function loadWords(){
  var q = db.collection('words')
    .where('topicId','==','top15k')
    .orderBy('order')
    .limit(PAGE_SIZE);
  q.get().then(function(snap){
    document.getElementById('loader').style.display='none';
    lastDoc = snap.docs[snap.docs.length - 1];
    var words = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    allWords = words;
    renderWords(words);
    if(snap.docs.length === PAGE_SIZE) document.getElementById('loadMoreBtn').style.display='';
  });
}

function loadMore(){
  if(!lastDoc) return;
  document.getElementById('loadMoreBtn').textContent = 'Yuklanmoqda…';
  db.collection('words').where('topicId','==','top15k').orderBy('order').startAfter(lastDoc).limit(PAGE_SIZE)
    .get().then(function(snap){
      lastDoc = snap.docs[snap.docs.length - 1];
      var more = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      allWords = allWords.concat(more);
      renderWords(allWords);
      document.getElementById('loadMoreBtn').textContent = "Ko'proq yuklash";
      if(snap.docs.length < PAGE_SIZE) document.getElementById('loadMoreBtn').style.display='none';
    });
}

function renderWords(words){
  var html = words.map(function(w){
    return '<div class="word-list-row" onclick="location.href=\'word.html?id='+w.id+'\'">'
      + '<div class="word-list-num">'+w.order+'</div>'
      + '<div class="word-list-word">'+escHtml(w.word)+'</div>'
      + '<div class="word-list-type">'+escHtml(w.type||'')+'</div>'
      + '</div>';
  }).join('');
  if(!html) html = '<div class="empty-state"><p>So\'z topilmadi</p></div>';
  document.getElementById('wordList').innerHTML = html;
}

function filterTop(){
  var q = document.getElementById('topSearch').value.toLowerCase();
  if(!q){ renderWords(allWords); return; }
  renderWords(allWords.filter(function(w){ return w.word.toLowerCase().includes(q); }));
}

function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
