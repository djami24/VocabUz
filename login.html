<script>
// Agar allaqachon login bo'lgan bo'lsa, asosiy sahifaga yuborish
firebase.auth().onAuthStateChanged(function(user){
  if(user) location.href = 'index.html';
});

function doLogin(){
  var email = document.getElementById('emailInput').value.trim();
  var pass  = document.getElementById('passInput').value;
  var btn   = document.getElementById('loginBtn');
  var gErr  = document.getElementById('globalErr');
  gErr.textContent = '';

  if(!email){ document.getElementById('emailErr').textContent = 'Email kiriting'; return; }
  if(!pass) { document.getElementById('passErr').textContent  = 'Parol kiriting'; return; }

  btn.disabled = true;
  btn.textContent = 'Yuklanmoqda…';

  firebase.auth().signInWithEmailAndPassword(email, pass)
    .then(function(cred){
      var uid = cred.user.uid;
      var now = firebase.firestore.FieldValue.serverTimestamp();
      // lastLogin ni users doc ga yozamiz
      db.collection('users').doc(uid).set({ lastLogin: now }, { merge: true }).catch(function(){});
      location.href = 'index.html';
    })
    .catch(function(err){
      btn.disabled = false;
      btn.textContent = 'Kirish';
      var msg = 'Xatolik yuz berdi';
      if(err.code === 'auth/user-not-found')    msg = 'Bunday foydalanuvchi topilmadi';
      if(err.code === 'auth/wrong-password')    msg = 'Parol noto\'g\'ri';
      if(err.code === 'auth/invalid-email')     msg = 'Email noto\'g\'ri';
      if(err.code === 'auth/too-many-requests') msg = 'Juda ko\'p urinish. Keyinroq urinib ko\'ring';
      gErr.textContent = msg;
    });
}

// Enter tugmasi
document.addEventListener('keydown', function(e){
  if(e.key === 'Enter') doLogin();
});
</script>
