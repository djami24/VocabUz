<div class="page">

    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" type="search" placeholder="Qidirish" id="searchInput" oninput="filterWords()">
  </div>

</div>

<div class="toast" id="toast"></div>

<nav class="bottom-nav">

    Asosiy
  </a>
  <a class="bottom-nav-item" href="mywords.html">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    So'zlarim
  </a>
  <a class="bottom-nav-item" href="search.html">

    Yo'l xaritasi
  </a>
  <a class="bottom-nav-item" href="profile.html">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Profil

</nav>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
var allWords = [];
var userBookmarks = [];
var userLikes = [];
var currentUser = null;
var currentTab = 'ALL';

firebase.auth().onAuthStateChanged(function(user) {
  if (!user) { location.href = 'login.html'; return; }
  currentUser = user;

  Promise.all([
    db.collection('users').doc(user.uid).get(),
    db.collection('words').where('category', '==', 'speaking').get()
  ]).then(function(results) {
    var userDoc   = results[0];
    var wordsSnap = results[1];
    document.getElementById('loader').style.display = 'none';
    if (userDoc.exists) {
      userBookmarks = userDoc.data().bookmarks || [];
      userLikes     = userDoc.data().likes     || [];
    }
    allWords = wordsSnap.docs.map(function(d) {
      var data = d.data();
      // "uz" field'ini "translation" sifatida ishlatamiz (admin uz deb saqlaydi)
      return Object.assign({ id: d.id, translation: data.uz || data.translation || '' }, data);
    });
    // orderBy o'rniga JS da tartiblaymiz (composite index shart emas)
    allWords.sort(function(a, b) { return (a.order || 0) - (b.order || 0); });
    if (!allWords.length) {
      document.getElementById('wordList').innerHTML =
        '<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><path d="M15 10s1 .5 1 2-1 2-1 2"/></svg><p>So\'zlar hali qo\'shilmagan</p></div>';
      return;
    }
    buildTabs();
    renderWords(getFiltered());
  }).catch(function(err) {
    document.getElementById('loader').style.display = 'none';
    document.getElementById('wordList').innerHTML =
      '<div class="empty-state"><p>Xatolik yuz berdi. Qayta urinib ko\'ring.</p></div>';
    console.error('Speaking vocab error:', err);
  });
});

function buildTabs() {
  var types = ['ALL'];
  allWords.forEach(function(w) {
    if (w.type && !types.includes(w.type)) types.push(w.type);
  });
  if (types.length <= 2) { document.getElementById('tabsWrap').style.display = 'none'; return; }
  document.getElementById('tabsWrap').innerHTML = types.map(function(t) {
    return '<button class="tab-btn' + (t === currentTab ? ' is-active' : '') + '" onclick="setTab(\'' + t + '\')">' +
      (t === 'ALL' ? 'Barchasi' : t) + '</button>';
  }).join('');
}

function setTab(t) {
  currentTab = t;
  document.querySelectorAll('.tab-btn').forEach(function(b) {
    b.classList.toggle('is-active', b.textContent === (t === 'ALL' ? 'Barchasi' : t));
  });
  renderWords(getFiltered());
}

function getFiltered() {
  var q = (document.getElementById('searchInput').value || '').toLowerCase();
  return allWords.filter(function(w) {
    var matchTab = currentTab === 'ALL' || w.type === currentTab;
    var matchQ   = !q || w.word.toLowerCase().includes(q) || (w.translation || w.uz || '').toLowerCase().includes(q);
    return matchTab && matchQ;
  });
}

function filterWords() { renderWords(getFiltered()); }

function renderWords(words) {
  if (!words.length) {
    document.getElementById('wordList').innerHTML =
      '<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>So\'z topilmadi</p></div>';
    return;
  }
  var html = '';
  words.forEach(function(w, i) {
    var bk = userBookmarks.includes(w.id);
    var lk = userLikes.includes(w.id);
    html += '<div class="word-card" id="wc-' + w.id + '">'
      + '<div class="word-card-header" onclick="location.href=\'word.html?id=' + w.id + '\'">'
      + '<div><span class="word-card-num">' + (i + 1) + '. </span>'
      + '<span class="word-card-word">' + escHtml(w.word) + '</span>'
      + '<span class="word-card-dash"> — </span>'
      + '<span class="word-card-translation">' + escHtml(w.translation) + '</span></div>'
      + '<svg class="word-card-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'
      + '</div>'
      + (w.example ? '<div class="word-card-example">' + escHtml(w.example) + '</div>' : '')
      + '<div class="word-card-actions">'
      + '<button class="word-action-btn" onclick="shareWord(\'' + escHtml(w.word) + '\',\'' + escHtml(w.translation) + '\')">'
      + '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>'
      + '</button>'
      + '<button class="word-action-btn" onclick="speak(\'' + escHtml(w.word) + '\')">'
      + '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>'
      + '</button>'
      + '<button class="word-action-btn' + (bk ? ' is-active' : '') + '" id="bk-' + w.id + '" onclick="toggleBookmark(\'' + w.id + '\')">'
      + '<svg width="18" height="18" viewBox="0 0 24 24" fill="' + (bk ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>'
      + '</button>'
      + '<button class="word-action-btn' + (lk ? ' is-liked' : '') + '" id="lk-' + w.id + '" onclick="toggleLike(\'' + w.id + '\')">'
      + '<svg width="18" height="18" viewBox="0 0 24 24" fill="' + (lk ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'
      + '</button>'
      + '</div></div>';
  });
  document.getElementById('wordList').innerHTML = html;
}

function toggleBookmark(wordId) {
  if (!currentUser) return;
  var idx = userBookmarks.indexOf(wordId);
  if (idx === -1) userBookmarks.push(wordId);
  else userBookmarks.splice(idx, 1);
  var bk = idx === -1;
  var btn = document.getElementById('bk-' + wordId);
  if (btn) {
    btn.classList.toggle('is-active', bk);
    btn.querySelector('svg').setAttribute('fill', bk ? 'currentColor' : 'none');
  }
  db.collection('users').doc(currentUser.uid).update({ bookmarks: userBookmarks });
  showToast(bk ? 'Saqlandi' : 'Olib tashlandi');
}

function toggleLike(wordId) {
  if (!currentUser) return;
  var idx = userLikes.indexOf(wordId);
  if (idx === -1) userLikes.push(wordId);
  else userLikes.splice(idx, 1);
  var lk = idx === -1;
  var btn = document.getElementById('lk-' + wordId);
  if (btn) {
    btn.classList.toggle('is-liked', lk);
    btn.querySelector('svg').setAttribute('fill', lk ? 'currentColor' : 'none');
  }
  db.collection('users').doc(currentUser.uid).update({ likes: userLikes });
}

function speak(word) {
  if (!('speechSynthesis' in window)) return;
  var utt = new SpeechSynthesisUtterance(word);
  utt.lang = 'en-US';
  speechSynthesis.cancel();
  speechSynthesis.speak(utt);
}

function shareWord(word, trans) {
  var text = word + ' — ' + trans;
  if (navigator.share) {
    navigator.share({ text: text }).catch(function(){});
  } else {
    navigator.clipboard.writeText(text).then(function(){ showToast('Nusxalandi'); });
  }
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('is-show');
  setTimeout(function(){ t.classList.remove('is-show'); }, 2000);
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
