<style>
/* ═══ SPEAKING VOCABULARY PAGE ═══ */
body { background: #F0FFF4; }

.sv-topbar {
  display:flex; align-items:center; gap:10px;
  padding:14px 16px 12px; background:#F0FFF4;
  position:sticky; top:0; z-index:10;
  border-bottom:1px solid #D1FAE5;
}
.sv-back {
  width:38px; height:38px; border-radius:50%; background:#fff;
  border:none; cursor:pointer; display:flex; align-items:center;
  justify-content:center; box-shadow:0 1px 4px rgba(34,197,94,.15);
  color:#5A6070; flex-shrink:0;
}
.sv-title { font-size:1.05rem; font-weight:700; flex:1; color:#1A1A2E; }
.sv-badge {
  font-size:.75rem; font-weight:700; padding:4px 10px; border-radius:20px;
  background:#DCFCE7; color:#16A34A; white-space:nowrap;
}

.sv-body { flex:1; overflow-y:auto; padding:0 16px 100px; }

.sv-section-label {
  padding:18px 0 10px; font-size:.78rem; font-weight:600;
  color:#9AA0AD; letter-spacing:.3px; text-transform:uppercase;
}

/* ── Type cards (View 1) ── */
.sv-type-card {
  background:#fff; border-radius:16px; padding:16px;
  box-shadow:0 1px 4px rgba(34,197,94,.12);
  display:flex; align-items:center; gap:14px;
  cursor:pointer; margin-bottom:10px;
  border:2px solid transparent;
  transition:border-color .15s, transform .12s;
  -webkit-tap-highlight-color:transparent;
  position:relative; overflow:hidden;
}
.sv-type-card:active { transform:scale(.98); }
.sv-type-card.completed { border-color:#22C55E; }
.sv-type-icon {
  width:48px; height:48px; border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  font-size:1.4rem; flex-shrink:0; background:#DCFCE7;
}
.sv-type-info { flex:1; min-width:0; }
.sv-type-name { font-size:.95rem; font-weight:800; color:#1A1A2E; }
.sv-type-sub { font-size:.75rem; color:#9AA0AD; margin-top:2px; }
.sv-type-badge {
  font-size:.72rem; font-weight:700; padding:3px 9px;
  border-radius:20px; white-space:nowrap; flex-shrink:0;
  background:#DCFCE7; color:#16A34A;
}
.sv-type-bar {
  position:absolute; bottom:0; left:0; height:3px;
  border-radius:0 2px 0 0; background:#22C55E;
  transition:width .4s ease;
}

/* ── Word cards (View 2) ── */
.sv-word-card {
  background:#fff; border-radius:14px; padding:13px 15px 11px;
  box-shadow:0 1px 4px rgba(34,197,94,.1); margin-bottom:10px;
}
.sv-word-card.learned { border-left:3px solid #22C55E; }
.sv-word-head {
  display:flex; align-items:baseline; gap:6px; margin-bottom:4px; flex-wrap:wrap;
}
.sv-word-num { font-size:.8rem; font-weight:700; color:#16A34A; flex-shrink:0; min-width:20px; }
.sv-word-en { font-size:.95rem; font-weight:700; color:#1A1A2E; }
.sv-word-dash { color:#8A9BB0; }
.sv-word-uz { font-size:.88rem; font-weight:500; color:#5A6070; flex:1; }
.sv-type-pill {
  display:inline-flex; align-items:center;
  background:#DCFCE7; color:#16A34A;
  font-size:.65rem; font-weight:700; padding:2px 6px; border-radius:6px;
  flex-shrink:0;
}
.sv-word-example {
  font-size:.82rem; color:#5A6070; font-style:italic; line-height:1.5;
  padding:5px 0 8px; border-bottom:1px solid #D1FAE5; margin-bottom:8px;
}
.sv-word-example::before { content:'• '; }
.sv-word-actions { display:flex; gap:8px; }
.sv-btn-learned {
  flex:1; height:36px; border-radius:10px; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:5px;
  font-size:.8rem; font-weight:700; font-family:inherit;
  background:#DCFCE7; color:#16A34A;
  transition:background .15s, color .15s;
  -webkit-tap-highlight-color:transparent;
}
.sv-btn-learned.done { background:#22C55E; color:#fff; }
.sv-btn-icon {
  width:36px; height:36px; border-radius:10px; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  background:#F0FFF4; color:#9AA0AD;
  transition:background .15s, color .15s;
  -webkit-tap-highlight-color:transparent; flex-shrink:0;
}
.sv-btn-icon.speak-active { background:#DCFCE7; color:#16A34A; }
.sv-btn-icon.bookmarked { background:#EFF6FF; color:#2196F3; }
.sv-btn-icon.liked { background:#FEE2E2; color:#EF4444; }

/* Progress banner */
.sv-progress-box {
  background:#fff; border-radius:12px; padding:13px 15px;
  box-shadow:0 1px 4px rgba(34,197,94,.1); margin-bottom:12px;
}
.sv-progress-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; }
.sv-progress-label { font-size:.82rem; font-weight:700; color:#1A1A2E; }
.sv-progress-pct { font-size:.82rem; font-weight:800; color:#16A34A; }
.sv-progress-track { height:7px; background:#D1FAE5; border-radius:7px; overflow:hidden; }
.sv-progress-fill { height:100%; background:linear-gradient(90deg,#22C55E,#16A34A); border-radius:7px; transition:width .4s; }

/* Done banner */
.sv-done-box {
  background:#DCFCE7; border-radius:12px; padding:13px 15px;
  display:flex; align-items:center; gap:10px; margin-bottom:12px;
}

/* Overall progress (top of type list) */
.sv-overall-box {
  background:#fff; border-radius:14px; padding:14px 16px;
  box-shadow:0 1px 4px rgba(34,197,94,.12); margin-bottom:14px;
}
.sv-overall-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.sv-overall-label { font-size:.85rem; font-weight:700; color:#1A1A2E; }
.sv-overall-nums { font-size:.85rem; font-weight:800; color:#16A34A; }
.sv-overall-track { height:8px; background:#D1FAE5; border-radius:8px; overflow:hidden; }
.sv-overall-fill { height:100%; background:linear-gradient(90deg,#22C55E,#16A34A); border-radius:8px; transition:width .4s; }

/* Spinner */
.sv-spinner-wrap { display:flex; align-items:center; justify-content:center; padding:60px 0; }
.sv-spinner { width:32px; height:32px; border:3px solid #BBF7D0; border-top-color:#22C55E; border-radius:50%; animation:svSpin .8s linear infinite; }
@keyframes svSpin { to { transform:rotate(360deg) } }

/* Toast */
.sv-toast {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px);
  background:#1A1A2E; color:#fff; padding:9px 18px; border-radius:20px;
  font-size:.8rem; font-weight:600; pointer-events:none; opacity:0;
  transition:opacity .25s, transform .25s; white-space:nowrap; z-index:600;
}
.sv-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ── O'rganilgan so'zlar bo'limi ── */
.sv-learned-section { margin-top:6px; }
.sv-learned-toggle {
  width:100%; display:flex; align-items:center; gap:8px; padding:13px 16px;
  border:none; border-radius:14px; background:#DCFCE7; color:#16A34A;
  font-family:inherit; font-size:.9rem; font-weight:800; cursor:pointer;
  text-align:left; margin-bottom:10px; -webkit-tap-highlight-color:transparent;
}
.sv-learned-toggle .lt-cnt { margin-left:auto; background:#22C55E; color:#fff; font-size:.74rem; padding:2px 9px; border-radius:99px; }
.sv-learned-toggle .lt-chev { display:flex; transition:transform .2s; }
.sv-learned-toggle.open .lt-chev { transform:rotate(180deg); }
.sv-learned-tools { display:flex; justify-content:flex-end; margin-bottom:10px; }
.sv-learned-tools button {
  border:none; background:#fff; color:#16A34A; font-family:inherit; font-size:.78rem; font-weight:700;
  padding:7px 12px; border-radius:99px; box-shadow:0 1px 4px rgba(34,197,94,.15); cursor:pointer;

.sv-word-uz.uz-hide { filter:blur(6px); cursor:pointer; user-select:none; }
.sv-alldone-note {
  background:#fff; border-radius:14px; padding:18px 16px; text-align:center; margin-bottom:10px;

.sv-test-ready {
  background:linear-gradient(135deg,#22C55E,#16A34A); color:#fff; border-radius:14px; padding:14px 16px;
  display:flex; align-items:center; gap:12px; margin-bottom:12px; cursor:pointer;

.sv-test-ready-txt { flex:1; }
.sv-test-ready-title { font-size:.92rem; font-weight:800; }
.sv-test-ready-sub { font-size:.75rem; opacity:.9; margin-top:2px; }
.sv-test-ready-btn { border:none; background:#fff; color:#16A34A; font-family:inherit; font-size:.78rem; font-weight:800; padding:8px 13px; border-radius:10px; cursor:pointer; }

/* ── O'rgandim mini-test (modal) ── */
#svLearnCheck { display:none; position:fixed; inset:0; z-index:450; background:rgba(26,26,46,.55); align-items:center; justify-content:center; padding:20px; }
#svLearnCheck.open { display:flex; }
.svq-box { width:100%; max-width:400px; background:#fff; border-radius:20px; padding:22px 18px 16px; box-shadow:0 12px 40px rgba(0,0,0,.25); }
.svq-label { font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#9AA0AD; text-align:center; }
.svq-word { font-size:1.7rem; font-weight:900; text-align:center; margin:6px 0 4px; color:#1A1A2E; word-break:break-word; }
.svq-note { font-size:.76rem; text-align:center; min-height:18px; margin-bottom:12px; color:#9AA0AD; font-weight:600; }
.svq-note.err { color:#EF4444; }
.svq-opts { display:flex; flex-direction:column; gap:9px; }
.svq-opt {
  width:100%; padding:15px 18px; border-radius:12px; border:2px solid #DCFCE7; background:#fff;
  font-family:inherit; font-size:.9rem; font-weight:600; color:#1A1A2E; cursor:pointer; text-align:left;
  transition:all .15s; -webkit-tap-highlight-color:transparent;
}
.svq-opt:active:not([disabled]) { background:#F0FFF4; }
.svq-opt.correct { background:#DCFCE7 !important; border-color:#22C55E !important; color:#16A34A !important; }
.svq-opt.wrong { background:#FEE2E2 !important; border-color:#EF4444 !important; color:#EF4444 !important; }
.svq-opt[disabled] { cursor:default; }
.svq-cancel { display:block; width:100%; margin-top:12px; padding:10px; border:none; background:none; font-family:inherit; font-size:.82rem; font-weight:600; color:#9AA0AD; cursor:pointer; }

/* ── Kategoriya testi (to'liq ekran) ── */
#svTest { display:none; position:fixed; inset:0; z-index:400; background:#F0FFF4; flex-direction:column; overflow-y:auto; }
#svTest.open { display:flex; }
.svt-top { display:flex; align-items:center; gap:10px; padding:14px 16px 10px; }
.svt-close { width:38px; height:38px; border-radius:50%; background:#fff; border:none; cursor:pointer; box-shadow:0 1px 4px rgba(34,197,94,.15); color:#5A6070; font-size:1rem; }
.svt-title { flex:1; font-size:1rem; font-weight:800; color:#1A1A2E; }
.svt-counter { font-size:.78rem; font-weight:700; background:#DCFCE7; color:#16A34A; padding:4px 10px; border-radius:20px; }
.svt-track { height:6px; background:#D1FAE5; margin:0 16px 8px; border-radius:6px; overflow:hidden; }
.svt-fill { height:100%; width:0; background:linear-gradient(90deg,#22C55E,#16A34A); transition:width .3s; }
.svt-body { padding:8px 16px 40px; max-width:460px; width:100%; margin:0 auto; }
.svt-q { text-align:center; padding:18px 0 10px; }
.svt-q-label { font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#9AA0AD; }
.svt-q-word { font-size:1.9rem; font-weight:900; color:#1A1A2E; margin:6px 0; word-break:break-word; }
.svt-err { text-align:center; font-size:.8rem; font-weight:600; color:#5A6070; margin-bottom:12px; }
.svt-next { display:none; width:100%; margin-top:14px; padding:14px; border:none; border-radius:12px; background:#22C55E; color:#fff; font-family:inherit; font-size:.92rem; font-weight:800; cursor:pointer; }
.svt-result { text-align:center; padding:30px 8px; }
.svt-result-title { font-size:1.4rem; font-weight:900; color:#1A1A2E; margin-bottom:8px; }
.svt-result-sub { font-size:.86rem; color:#5A6070; line-height:1.55; margin-bottom:18px; }
.svt-stats { display:flex; justify-content:center; gap:22px; margin-bottom:22px; }
.svt-stat-val { font-size:1.5rem; font-weight:900; }
.svt-stat-lbl { font-size:.72rem; color:#9AA0AD; font-weight:600; }
.svt-btns { display:flex; flex-direction:column; gap:10px; }
.svt-btn { padding:14px; border:none; border-radius:12px; font-family:inherit; font-size:.9rem; font-weight:800; cursor:pointer; }
.svt-btn.primary { background:#22C55E; color:#fff; }
.svt-btn.secondary { background:#fff; color:#16A34A; box-shadow:0 1px 4px rgba(34,197,94,.15); }

.sv-empty { text-align:center; padding:48px 16px; color:#9AA0AD; font-size:.88rem; }
</style>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script>
// ═══ STATE ═══
var currentUser = null;
var SV_WORDS    = [];        // all speaking words
var svLearned   = [];  // _docId strings
var svBookmarks = [];  // numeric w.id (same as mywords.html vz_bookmarks)
var svPassed    = [];  // testdan o'tgan kategoriyalar (type nomlari)
var svLearnedOpen   = false; // "O'rganilgan so'zlar" bo'limi ochiqmi
var svLearnedHideUz = false; // o'rganilganlarda tarjima yashirinmi
var svView      = 'types';   // 'types' | 'words'
var svCurrentType = null;

var TYPE_EMOJIS = ['🗣️','💬','🎯','📢','🧠','✨','🔥','💡','🎤','📣'];

// ═══ PERSIST ═══
function svLoadLocal() {
  svLearned   = JSON.parse(lsGet('sv_learned', '[]'));
  svBookmarks = JSON.parse(lsGet('vz_bookmarks', '[]')).map(Number);
  svPassed    = JSON.parse(lsGet('sv_passed', '[]'));
}
function svSaveLocal() {
  lsSet('sv_learned', JSON.stringify(svLearned));
  lsSet('vz_bookmarks', JSON.stringify(svBookmarks));
  lsSet('sv_passed', JSON.stringify(svPassed));
}
function svSaveFirestore() {
  if (!currentUser) return;
  var ref = db.collection('users').doc(currentUser.uid);
  // Save svLearned and bookmarks separately using merge so we don't
  // overwrite data written by other pages (topic.html, mywords.html).
  // bookmarks is a shared field across all vocab sections — always merge it.
  var data = { svLearned: svLearned, svPassed: svPassed, bookmarks: svBookmarks };
  ref.set(data, { merge: true }).catch(function(err) {
    console.warn('svSaveFirestore error:', err);
  });
}

function svLogActivityToday(delta) {
  if (!currentUser || delta === 0) return;
  var d = new Date();
  var key = 'activityLog.' + d.getFullYear() + '-' +
    (d.getMonth()+1).toString().padStart(2,'0') + '-' +
    d.getDate().toString().padStart(2,'0');
  var upd = {};
  upd[key] = firebase.firestore.FieldValue.increment(delta);
  db.collection('users').doc(currentUser.uid).set(upd, {merge:true}).catch(function(){});
}

// ═══ AUTH ═══
firebase.auth().onAuthStateChanged(function(user) {
  if (!user) { location.href = 'login.html'; return; }
  currentUser = user;
  _currentUID = user.uid;  // storage-utils lsKey() uchun
  svLoadLocal();

  // Load Firestore state + words in parallel
  Promise.all([
    db.collection('users').doc(user.uid).get(),
    db.collection('words').where('category', '==', 'speaking').get()
  ]).then(function(results) {
    var userDoc   = results[0];
    var wordsSnap = results[1];

    // ── PREMIUM CHECK ──
    var isPremium2 = false;
    if (userDoc.exists) {
      var udata = userDoc.data();
      isPremium2 = !!(udata.isPremium);
    }
    if (!isPremium2) {
      // Bir marta qayta tekshiramiz (auth-guard.js dan keyin kelishi mumkin)
      db.collection('users').doc(user.uid).get().then(function(freshDoc) {
        if (freshDoc.exists && freshDoc.data().isPremium) {
          // Premium tasdiqlandi — sahifani yuklash
          svLoadContent(freshDoc, wordsSnap, user);
        } else {
          document.getElementById('svBody').innerHTML =
            '<div style="text-align:center;padding:60px 20px">' +
            '<div style="font-size:3rem;margin-bottom:16px">&#128274;</div>' +
            '<div style="font-size:1.1rem;font-weight:800;color:#1A2333;margin-bottom:8px">Premium kerak</div>' +
            '<div style="font-size:.88rem;color:#4A5568;margin-bottom:24px">Avval Premium sotib oling</div>' +
            '<button onclick="location.href=\'premium.html\'" style="padding:14px 32px;background:linear-gradient(135deg,#FFB300,#FF8F00);color:#fff;border:none;border-radius:14px;font-size:.95rem;font-weight:800;cursor:pointer">&#128081; VocabUz Premium</button>' +
            '</div>';
        }
      }).catch(function() {
        document.getElementById('svBody').innerHTML =
          '<div class="sv-empty">Xatolik yuz berdi. Qayta urinib ko\'ring.</div>';
      });
      return;
    }

    svLoadContent(userDoc, wordsSnap, user);
  }).catch(function(err) {
    document.getElementById('svBody').innerHTML =
      '<div class="sv-empty">Xatolik yuz berdi. Qayta urinib ko\'ring.</div>';
    console.error(err);
  });
});

function svLoadContent(userDoc, wordsSnap, user) {
    // Merge Firestore data into local
    if (userDoc.exists) {
      var ud = userDoc.data();
      (ud.svLearned   || []).forEach(function(id) { if (!svLearned.includes(id))   svLearned.push(id); });
      svBookmarks = (ud.bookmarks || []).map(Number);
      (ud.svPassed    || []).forEach(function(t) { if (!svPassed.includes(t)) svPassed.push(t); });
      svSaveLocal();
    }

    // Build word list (normalize field names)
    SV_WORDS = wordsSnap.docs.map(function(d) {
      var data = d.data();
      return Object.assign({
        _docId: d.id,
        uz: data.uz || data.translation || ''
      }, data);
    });
    SV_WORDS.sort(function(a, b) { return (a.order || 0) - (b.order || 0); });

    renderTypes();

    // Real-time premium kuzatuvchi — admin o'chirganda darhol chiqaradi
    db.collection('users').doc(user.uid).onSnapshot(function(doc) {
      if (!doc.exists) return;
      if (!doc.data().isPremium) {
        document.getElementById('svBody').innerHTML =
          '<div style="text-align:center;padding:60px 20px">' +
          '<div style="font-size:2.8rem;margin-bottom:14px">😔</div>' +
          '<div style="font-size:1.05rem;font-weight:800;color:#1A2333;margin-bottom:8px">Premium bekor qilindi</div>' +
          '<div style="font-size:.85rem;color:#8A9BB0;margin-bottom:24px;line-height:1.5">Admin tomonidan Premium obunangiz o\'chirildi.</div>' +
          '<button onclick="location.href=\'index.html\'" style="padding:14px 32px;background:linear-gradient(135deg,#1565C0,#1DA1F2);color:#fff;border:none;border-radius:14px;font-size:.95rem;font-weight:800;cursor:pointer">Asosiy sahifaga qaytish</button>' +
          '</div>';
      }
    }, function() {});
}

// ═══ GO BACK ═══
function svGoBack() {
  if (svView === 'words') {
    svView = 'types';
    svCurrentType = null;
    renderTypes();
  } else {
    history.back();
  }
}

// ═══ HELPERS ═══
function svTypes() {
  var seen = [];
  SV_WORDS.forEach(function(w) {
    var t = w.type || 'Umumiy';
    if (!seen.includes(t)) seen.push(t);
  });
  return seen;
}
function svWordsOfType(type) {
  return SV_WORDS.filter(function(w) {
    return (w.type || 'Umumiy') === type;
  });
}

// ═══ VIEW 1: KATEGORIYALAR ═══
function renderTypes() {
  svView = 'types';
  var types   = svTypes();
  var total   = SV_WORDS.length;
  var learned = SV_WORDS.filter(function(w) { return svLearned.includes(w._docId); }).length;
  var pct     = total > 0 ? Math.round(learned / total * 100) : 0;

  document.getElementById('svTitle').textContent = 'Ielts and Cefr Vocabulary';
  document.getElementById('svBadge').textContent = learned + " o'rganilgan";
  document.getElementById('svBackBtn').style.display = 'none';

  if (!total) {
    document.getElementById('svBody').innerHTML = '<div class="sv-empty">Hali so\'zlar qo\'shilmagan</div>';
    return;
  }

  // Overall progress
  var overallHtml =
    '<div class="sv-overall-box">' +
      '<div class="sv-overall-row">' +
        '<span class="sv-overall-label">Umumiy progress</span>' +
        '<span class="sv-overall-nums">' + learned + ' / ' + total + '</span>' +
      '</div>' +
      '<div class="sv-overall-track">' +
        '<div class="sv-overall-fill" style="width:' + pct + '%"></div>' +
      '</div>' +
    '</div>';

  // Type cards
  var cardsHtml = '<div class="sv-section-label">Kategoriya tanlang</div>';
  types.forEach(function(type, idx) {
    var words    = svWordsOfType(type);
    var lrn      = words.filter(function(w) { return svLearned.includes(w._docId); }).length;
    var tot      = words.length;
    var p        = tot > 0 ? Math.round(lrn / tot * 100) : 0;
    var isFull   = lrn === tot && tot > 0;
    var isDone   = svPassed.includes(type);
    var emoji    = TYPE_EMOJIS[idx % TYPE_EMOJIS.length];
    var safe     = type.replace(/'/g, "\\'");

    cardsHtml +=
      '<div class="sv-type-card' + (isDone ? ' completed' : '') + '" onclick="openType(\'' + safe + '\')">' +
        '<div class="sv-type-icon">' + emoji + '</div>' +
        '<div class="sv-type-info">' +
          '<div class="sv-type-name">' + esc(type) + '</div>' +
          '<div class="sv-type-sub">' + tot + " ta so'z</div>" +
        '</div>' +
        '<div class="sv-type-badge">' +
          (isDone
            ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> O\'tildi'
            : (isFull ? 'Testga tayyor' : lrn + '/' + tot)) +
        '</div>' +
        '<div class="sv-type-bar" style="width:' + p + '%"></div>' +
      '</div>';
  });

  document.getElementById('svBody').innerHTML = overallHtml + cardsHtml;
}

// ═══ VIEW 2: SO'ZLAR ═══
function openType(type) {
  svCurrentType = type;
  svLearnedOpen = false;
  svLearnedHideUz = false;
  svView = 'words';
  document.getElementById('svBackBtn').style.display = '';
  renderWords();
}

function renderWords() {
  var type    = svCurrentType;
  var words   = svWordsOfType(type);
  var learned = words.filter(function(w) { return svLearned.includes(w._docId); }).length;
  var total   = words.length;
  var pct     = total > 0 ? Math.round(learned / total * 100) : 0;
  var full    = learned === total && total > 0;

  document.getElementById('svTitle').textContent = type;
  document.getElementById('svBadge').textContent = learned + '/' + total;

  // Banner
  var banner = '';
  var passedType = svPassed.indexOf(type) !== -1;
  if (passedType) {
    banner =
      '<div class="sv-done-box">' +
        '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="20 6 9 17 4 12"/></svg>' +
        '<div>' +
          '<div style="font-size:.88rem;font-weight:800;color:#16A34A">Kategoriya o\'tildi! \u2713</div>' +
          '<div style="font-size:.75rem;color:#16A34A;opacity:.8">Barcha so\'zlarni yaxshi bilasiz</div>' +
        '</div>' +
      '</div>';
  } else if (full) {
    banner =
      '<div class="sv-test-ready" onclick="svStartTest()">' +
        '<div class="sv-test-ready-txt"><div class="sv-test-ready-title">Test boshlashga tayyor!</div>' +
        '<div class="sv-test-ready-sub">Barcha ' + total + ' ta so\'zni o\'rgandingiz</div></div>' +
        '<button class="sv-test-ready-btn" type="button">Testni boshlash</button>' +
      '</div>';
  } else {
    banner =
      '<div class="sv-progress-box">' +
        '<div class="sv-progress-row">' +
          '<span class="sv-progress-label">O\'rganish jarayoni</span>' +
          '<span class="sv-progress-pct">' + pct + '%</span>' +
        '</div>' +
        '<div class="sv-progress-track">' +
          '<div class="sv-progress-fill" style="width:' + pct + '%"></div>' +
        '</div>' +
      '</div>';
  }

  // Word cards
  function svCardHtml(w, num, inLearned) {
    var isLearned = svLearned.includes(w._docId);
    var safe = w._docId.replace(/'/g, "\\'");
    // bookmarkId: numeric w.id bo'lsa u, yo'q bo'lsa _docId (mywords.html ikkalasini ham qabul qiladi)
    var bookmarkId = (w.id != null && w.id !== '' && !isNaN(Number(w.id))) ? Number(w.id) : w._docId;
    var isBm = svBookmarks.includes(bookmarkId);
    var safeBookmarkId = (typeof bookmarkId === 'string') ? ('\'' + bookmarkId.replace(/'/g, "\\'") + '\'') : bookmarkId;
    var bmClick = 'svToggleBookmark(' + safeBookmarkId + ')';
    return (
      '<div class="sv-word-card' + (isLearned ? ' learned' : '') + '" id="svcard-' + w._docId + '">' +
        '<div class="sv-word-head">' +
          '<span class="sv-word-num">' + num + '.</span>' +
          '<span class="sv-word-en">' + esc(w.word || '') + '</span>' +
          '<span class="sv-word-dash"> – </span>' +
          '<span class="sv-word-uz' + (inLearned && svLearnedHideUz ? ' uz-hide' : '') + '"' + (inLearned ? ' onclick="this.classList.toggle(\'uz-hide\')"' : '') + '>' + esc(w.uz || '') + '</span>' +
          (w.type ? '<span class="sv-type-pill">' + esc(w.type) + '</span>' : '') +
        '</div>' +
        (w.example ? '<div class="sv-word-example">' + esc(w.example) + '</div>' : '') +
        '<div class="sv-word-actions">' +
          '<button class="sv-btn-learned' + (isLearned ? ' done' : '') + '" id="svlrn-' + w._docId + '" onclick="svMarkLearned(\'' + safe + '\')">' +
            (isLearned
              ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> O\'rgandim'
              : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg> O\'rgandim') +
          '</button>' +
          '<button class="sv-btn-icon' + (isBm ? ' bookmarked' : '') + '" id="svbm-' + w._docId + '" onclick="' + bmClick + '" title="Bookmark">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="' + (isBm ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>' +
          '</button>' +
          '<button class="sv-btn-icon" onclick="svSpeak(\'' + esc(w.word || '') + '\')" title="Talaffuz">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>'
    );
  }

  // Yodlanmagan so'zlar — asosiy ro'yxat; o'rganilganlar — alohida bo'limda
  var pending = words.filter(function(w) { return !svLearned.includes(w._docId); });
  var done    = words.filter(function(w) { return  svLearned.includes(w._docId); });

  var wordsHtml = pending.map(function(w, i) { return svCardHtml(w, i + 1, false); }).join('');
  if (!pending.length && total) {
    wordsHtml = '<div class="sv-alldone-note">Barcha so\'zlar o\'rganildi \uD83C\uDF89</div>';
  }
  if (done.length) {
    var chev = '<span class="lt-chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>';
    wordsHtml += '<div class="sv-learned-section">' +
      '<button type="button" class="sv-learned-toggle' + (svLearnedOpen ? ' open' : '') + '" onclick="svToggleLearnedSection()">' +
        '\u2713 O\'rganilgan so\'zlar<span class="lt-cnt">' + done.length + '</span>' + chev +
      '</button>';
    if (svLearnedOpen) {
      wordsHtml += '<div class="sv-learned-tools"><button type="button" onclick="svToggleHideUz()">' +
        (svLearnedHideUz ? "Tarjimani ko'rsatish" : "Tarjimani yashirish (o'zingizni tekshiring)") + '</button></div>';
      wordsHtml += done.map(function(w, i) { return svCardHtml(w, i + 1, true); }).join('');
    }
    wordsHtml += '</div>';
  }

  document.getElementById('svBody').innerHTML = banner + wordsHtml + '<div style="height:30px"></div>';
  document.getElementById('svBody').scrollTop = 0;
}

// ═══ ACTIONS ═══
// ═══ O'RGANDIM — so'z mini-test orqali tasdiqlanadi ═══
var SV_LEARN_MIN_GAP_MS  = 3000;   // ketma-ket ikki so'z orasidagi minimal vaqt
var SV_LEARN_MAX_PER_MIN = 8;      // 1 daqiqada ko'pi bilan nechta so'z tasdiqlanadi
var SV_LEARN_MAX_TRIES   = 2;      // bir so'z uchun urinishlar soni
var SV_LEARN_LOCK_MS     = 15000;  // ikkala urinish xato bo'lsa so'z shu vaqtga bloklanadi
var svLearnMarks = [];             // oxirgi tasdiqlash vaqtlari
var svLearnLocks = {};             // { docId: qulf tugash vaqti }
var svLearnCur   = null;           // { id, tries, answered }

function svMarkLearned(docId) {
  if (!currentUser) return;
  var idx = svLearned.indexOf(docId);
  if (idx !== -1) {
    // Olib tashlash — avvalgidek darhol
    svLearned.splice(idx, 1);
    svShowToast("O'rganilganlardan olib tashlandi");
    svLogActivityToday(-1);
    svSaveLocal();
    svSaveFirestore();
    renderWords();
    return;
  }
  // Yangi so'z — avval to'siqlar, keyin mini-test
  var now = Date.now();
  if (svLearnLocks[docId] && svLearnLocks[docId] > now) {
    svShowToast("So'zni qayta o'qib chiqing · " + Math.ceil((svLearnLocks[docId] - now) / 1000) + " soniyadan keyin");
    return;
  }
  svLearnMarks = svLearnMarks.filter(function(t) { return now - t < 60000; });
  if (svLearnMarks.length && now - svLearnMarks[svLearnMarks.length - 1] < SV_LEARN_MIN_GAP_MS) {
    svShowToast("Shoshilmang — so'zni yaxshilab yodlang");
    return;
  }
  if (svLearnMarks.length >= SV_LEARN_MAX_PER_MIN) {
    svShowToast("Juda tez! " + Math.ceil((svLearnMarks[0] + 60000 - now) / 1000) + " soniya so'zlarni takrorlang");
    return;
  }
  svOpenLearnCheck(docId);
}

// Noto'g'ri variantlar: avval shu kategoriyadan, yetmasa boshqa so'zlardan (takrorlanmasdan)
function svPickOptions(w, poolFirst) {
  var used = {}; used[(w.uz || '').trim().toLowerCase()] = true;
  var wrong = [];
  function pick(list) {
    list.slice().sort(function() { return Math.random() - .5; }).forEach(function(x) {
      var k = (x.uz || '').trim().toLowerCase();
      if (wrong.length < 3 && k && !used[k] && x._docId !== w._docId) { used[k] = true; wrong.push(x); }
    });
  }
  pick(poolFirst);
  if (wrong.length < 3) pick(SV_WORDS);
  return [w].concat(wrong).sort(function() { return Math.random() - .5; });
}

function svOpenLearnCheck(docId) {
  svLearnCur = { id: docId, tries: 0, answered: false };
  document.getElementById('svLearnCheck').classList.add('open');
  svRenderLearnCheck();
}
function svCloseLearnCheck() {
  document.getElementById('svLearnCheck').classList.remove('open');
  svLearnCur = null;
}
function svRenderLearnCheck() {
  if (!svLearnCur) return;
  var w = SV_WORDS.find(function(x) { return x._docId === svLearnCur.id; });
  if (!w) { svCloseLearnCheck(); return; }
  svLearnCur.answered = false;
  var options = svPickOptions(w, svWordsOfType(w.type || 'Umumiy'));

  document.getElementById('svqWord').textContent = w.word || '';
  var note = document.getElementById('svqNote');
  note.className = 'svq-note';
  note.textContent = svLearnCur.tries > 0 ? "Xato — yana urinib ko'ring (" + svLearnCur.tries + "/" + SV_LEARN_MAX_TRIES + ")" : '';
  if (svLearnCur.tries > 0) note.classList.add('err');

  var box = document.getElementById('svqOpts');
  box.innerHTML = '';
  options.forEach(function(opt) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'svq-opt';
    b.textContent = opt.uz || '';
    b.addEventListener('click', function() { svAnswerLearnCheck(opt._docId === w._docId, b); });
    box.appendChild(b);
  });
}
function svAnswerLearnCheck(isCorrect, btn) {
  if (!svLearnCur || svLearnCur.answered) return;
  svLearnCur.answered = true;
  var wid = svLearnCur.id;
  document.querySelectorAll('#svqOpts .svq-opt').forEach(function(b) { b.disabled = true; });

  if (isCorrect) {
    btn.classList.add('correct');
    setTimeout(function() {
      var now = Date.now();
      svCloseLearnCheck();
      if (svLearned.indexOf(wid) === -1) {
        svLearned.push(wid);
        svLearnMarks.push(now);
        svShowToast("O'rgandim! So'z saqlandi!");
        svLogActivityToday(1);
        svSaveLocal();
        svSaveFirestore();
      }
      renderWords();
    }, 550);
    return;
  }

  btn.classList.add('wrong');
  svLearnCur.tries++;
  if (svLearnCur.tries >= SV_LEARN_MAX_TRIES) {
    svLearnLocks[wid] = Date.now() + SV_LEARN_LOCK_MS;
    setTimeout(function() {
      svCloseLearnCheck();
      svShowToast("Xato. So'zni yana bir bor o'qib chiqing");
    }, 700);
  } else {
    setTimeout(svRenderLearnCheck, 700);
  }
}

// ═══ KATEGORIYA TESTI — barcha so'zlar, 90% qoidasi ═══
var SV_PASS_PERCENT = 90;   // testdan o'tish uchun kerakli to'g'ri javoblar foizi
function svMaxErrors(total) {
  return Math.max(1, Math.floor(total * (100 - SV_PASS_PERCENT) / 100)); // kamida 1 ta xato mumkin
}
var svTWords = [], svTIdx = 0, svTErrors = 0, svTCorrect = 0, svTAnswered = false;

function svStartTest() {
  var type = svCurrentType;
  var words = svWordsOfType(type).slice().sort(function() { return Math.random() - .5; });
  if (!words.length) return;
  svTWords = words; svTIdx = 0; svTErrors = 0; svTCorrect = 0; svTAnswered = false;
  document.getElementById('svtTitle').textContent = type + ' testi';
  document.getElementById('svTest').classList.add('open');
  svRenderTestQuestion();
}
function svCloseTest() {
  document.getElementById('svTest').classList.remove('open');
  renderWords();
}
function svErrInfoHtml() {
  return "Xato: <b style=\"color:" + (svTErrors > 0 ? '#EF4444' : '#1A1A2E') + "\">" + svTErrors + "</b> / " + svMaxErrors(svTWords.length) +
    "<span style=\"margin-left:6px;color:#9AA0AD\">(o'tish uchun kamida " + SV_PASS_PERCENT + "% to'g'ri)</span>";
}
function svRenderTestQuestion() {
  if (svTIdx >= svTWords.length) { svRenderTestResult(); return; }
  var w = svTWords[svTIdx];
  var total = svTWords.length;
  svTAnswered = false;
  document.getElementById('svtCounter').textContent = (svTIdx + 1) + '/' + total;
  document.getElementById('svtFill').style.width = ((svTIdx + 1) / total * 100) + '%';

  var options = svPickOptions(w, svWordsOfType(w.type || 'Umumiy'));
  var body = document.getElementById('svtBody');
  body.innerHTML = '';
  var q = document.createElement('div');
  q.className = 'svt-q';
  q.innerHTML = '<div class="svt-q-label">Tarjimasini tanlang</div><div class="svt-q-word"></div>';
  q.querySelector('.svt-q-word').textContent = w.word || '';
  body.appendChild(q);

  var err = document.createElement('div');
  err.className = 'svt-err'; err.id = 'svtErr'; err.innerHTML = svErrInfoHtml();
  body.appendChild(err);

  var opts = document.createElement('div');
  opts.className = 'svq-opts';
  options.forEach(function(opt) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'svq-opt'; b.textContent = opt.uz || '';
    b.addEventListener('click', function() { svCheckTestAnswer(opt._docId === w._docId, b, opts, w); });
    opts.appendChild(b);
  });
  body.appendChild(opts);

  var next = document.createElement('button');
  next.type = 'button'; next.className = 'svt-next'; next.id = 'svtNext';
  next.textContent = (svTIdx + 1 < total) ? 'Keyingi savol' : "Natijani ko'rish";
  next.addEventListener('click', function() { svTIdx++; svRenderTestQuestion(); });
  body.appendChild(next);
}
function svCheckTestAnswer(isCorrect, btn, optsBox, w) {
  if (svTAnswered) return;
  svTAnswered = true;
  optsBox.querySelectorAll('.svq-opt').forEach(function(b) { b.disabled = true; });
  if (isCorrect) {
    btn.classList.add('correct'); svTCorrect++;
  } else {
    btn.classList.add('wrong'); svTErrors++;
    optsBox.querySelectorAll('.svq-opt').forEach(function(b) {
      if (b.textContent === (w.uz || '')) b.classList.add('correct');
    });
  }
  var e = document.getElementById('svtErr');
  if (e) e.innerHTML = svErrInfoHtml();
  if (svTErrors > svMaxErrors(svTWords.length)) {
    setTimeout(svRenderTestFail, 800);
    return;
  }
  document.getElementById('svtNext').style.display = 'block';
}
function svStatsHtml(colors) {
  return '<div class="svt-stats">' +
    '<div><div class="svt-stat-val" style="color:#16A34A">' + svTCorrect + '</div><div class="svt-stat-lbl">To\'g\'ri</div></div>' +
    '<div><div class="svt-stat-val" style="color:#EF4444">' + svTErrors + '</div><div class="svt-stat-lbl">Xato</div></div>' +
    (colors ? '<div><div class="svt-stat-val" style="color:#1565C0">' + Math.round(svTCorrect / svTWords.length * 100) + '%</div><div class="svt-stat-lbl">Natija</div></div>' : '') +
  '</div>';
}
function svRenderTestFail() {
  document.getElementById('svtBody').innerHTML =
    '<div class="svt-result">' +
      '<div class="svt-result-title">Test o\'tmadi</div>' +
      '<div class="svt-result-sub">Ruxsat etilgan xatolar soni (' + svMaxErrors(svTWords.length) + ' ta) dan oshib ketdi. ' +
        'Testdan o\'tish uchun kamida ' + SV_PASS_PERCENT + '% to\'g\'ri javob kerak. So\'zlarni yana bir bor takrorlab, qayta urining!</div>' +
      svStatsHtml(false) +
      '<div class="svt-btns">' +
        '<button class="svt-btn primary" type="button" onclick="svStartTest()">Qaytadan boshlash</button>' +
        '<button class="svt-btn secondary" type="button" onclick="svCloseTest()">So\'zlarni takrorlash</button>' +
      '</div>' +
    '</div>';
}
function svRenderTestResult() {
  var passed = svTErrors <= svMaxErrors(svTWords.length);
  if (!passed) { svRenderTestFail(); return; }
  if (svPassed.indexOf(svCurrentType) === -1) {
    svPassed.push(svCurrentType);
    svSaveLocal();
    svSaveFirestore();
  }
  document.getElementById('svtBody').innerHTML =
    '<div class="svt-result">' +
      '<div class="svt-result-title">Tabriklaymiz! 🎉</div>' +
      '<div class="svt-result-sub"><strong></strong> kategoriyasidan testni muvaffaqiyatli topshirdingiz!</div>' +
      svStatsHtml(true) +
      '<div class="svt-btns">' +
        '<button class="svt-btn primary" type="button" onclick="svCloseTest();svGoBack()">Kategoriyalar ro\'yxatiga</button>' +
      '</div>' +
    '</div>';
  document.querySelector('#svtBody .svt-result-sub strong').textContent = svCurrentType;
}

// ═══ O'RGANILGAN SO'ZLAR BO'LIMI ═══
function svToggleLearnedSection() { svLearnedOpen = !svLearnedOpen; renderWords(); }
function svToggleHideUz()         { svLearnedHideUz = !svLearnedHideUz; renderWords(); }


function svToggleBookmark(bmId) {
  // bmId raqam yoki _docId string bo'lishi mumkin
  var idx = svBookmarks.indexOf(bmId);
  if (typeof bmId === 'number' || !isNaN(Number(bmId))) bmId = Number(bmId);
  idx = svBookmarks.indexOf(bmId);
  if (idx === -1) {
    svBookmarks.push(bmId);
    svShowToast("Yodlash ro'yxatiga qo'shildi!");
  } else {
    svBookmarks.splice(idx, 1);
    svShowToast("Yodlashdan olib tashlandi");
  }
  svSaveLocal();
  svSaveFirestore();
  var w = SV_WORDS.find(function(x){ return (Number(x.id) === bmId) || x._docId === String(bmId); });
  if (w) {
    var btn = document.getElementById('svbm-' + w._docId);
    if (btn) {
      var a = svBookmarks.includes(bmId);
      btn.className = 'sv-btn-icon' + (a ? ' bookmarked' : '');
      btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="' + (a ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
    }
  }
}

function svSpeak(word) {
  if (!('speechSynthesis' in window)) return;
  var utt = new SpeechSynthesisUtterance(word);
  utt.lang = 'en-US';
  speechSynthesis.cancel();
  speechSynthesis.speak(utt);
}

// ═══ TOAST ═══
var svToastTimer;
function svShowToast(msg) {
  var el = document.getElementById('svToast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(svToastTimer);
  svToastTimer = setTimeout(function() { el.classList.remove('show'); }, 2000);
}

// ═══ ESCAPE HTML ═══
function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
