<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>So'zlarim — VocabUZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --blue:#2196F3;
  --blue-light:#E3F2FD;
  --blue-mid:#BBDEFB;
  --red:#E53935;
  --red-light:#FFEBEE;
  --ink:#1A1A2E;
  --ink-mid:#5A6070;
  --ink-soft:#9AA0AD;
  --white:#FFFFFF;
  --bg:#F0F6FF;
  --card-bg:#FFFFFF;
  --shadow-sm:0 1px 4px rgba(33,150,243,.10);
  --shadow-md:0 4px 16px rgba(33,150,243,.13);
  --radius:16px;
  --radius-sm:12px;
  --bottom-nav-h:66px;
}

html,body{
  min-height:100%;
  background:var(--bg);
  font-family:'Inter',sans-serif;
  color:var(--ink);
}

/* ── TOP BAR ── */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--bg);
  padding:14px 16px 0;
}
.topbar-row{
  display:flex;align-items:center;gap:10px;
  margin-bottom:12px;
}
.topbar-title{font-size:1.1rem;font-weight:800;flex:1;}
.topbar-count{
  font-size:.78rem;font-weight:600;
  background:var(--blue-light);color:var(--blue);
  padding:4px 10px;border-radius:20px;
  transition:background .2s,color .2s;
}
.topbar-count.red{background:var(--red-light);color:var(--red);}

/* ── SEGMENT TABS ── */
.seg-tabs{
  display:flex;
  background:var(--white);
  border-radius:14px;
  padding:4px;
  margin-bottom:14px;
  box-shadow:var(--shadow-sm);
}
.seg-tab{
  flex:1;padding:9px 0;
  border:none;border-radius:11px;
  font-family:inherit;font-size:.85rem;font-weight:600;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  color:var(--ink-soft);background:transparent;
  transition:background .18s,color .18s,box-shadow .18s;
}
.seg-tab.active-bm{
  background:var(--blue);color:#fff;
  box-shadow:0 2px 8px rgba(33,150,243,.28);
}
.seg-tab.active-lk{
  background:var(--red);color:#fff;
  box-shadow:0 2px 8px rgba(229,57,53,.28);
}

/* ── SEARCH ── */
.search-wrap{
  position:relative;
  margin-bottom:4px;
}
.search-input{
  width:100%;height:42px;
  border-radius:var(--radius-sm);
  border:1.5px solid var(--blue-mid);
  background:var(--white);
  padding:0 14px 0 38px;
  font-size:.88rem;color:var(--ink);
  outline:none;font-family:inherit;
}
.search-input:focus{border-color:var(--blue);}
.search-icon{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--ink-soft);pointer-events:none;
}

/* ── CONTENT AREA ── */
.content{
  padding:14px 16px calc(var(--bottom-nav-h) + 24px);
  display:flex;flex-direction:column;gap:10px;
}

/* ── WORD CARD ── */
.word-card{
  background:var(--card-bg);
  border-radius:var(--radius);
  padding:14px 16px 12px;
  box-shadow:var(--shadow-sm);
}

.word-header{
  display:flex;align-items:baseline;gap:6px;
  margin-bottom:4px;flex-wrap:wrap;
}
.word-num{
  font-size:.82rem;font-weight:700;color:var(--blue);
  flex-shrink:0;min-width:22px;
}
.word-en{
  font-size:.97rem;font-weight:700;color:var(--ink);
}
.word-dash{color:var(--ink-mid);font-size:.92rem;}
.word-uz{
  font-size:.9rem;font-weight:500;color:var(--ink-mid);
  flex:1;
}
.level-badge{
  display:inline-flex;align-items:center;
  background:var(--blue-light);color:var(--blue);
  font-size:.68rem;font-weight:700;
  padding:2px 7px;border-radius:8px;
  margin-left:2px;flex-shrink:0;
}
.word-topic{
  font-size:.72rem;font-weight:600;
  background:#F3F4F6;color:var(--ink-soft);
  padding:2px 8px;border-radius:8px;flex-shrink:0;
}

.word-example{
  font-size:.84rem;color:var(--ink-mid);
  font-style:italic;line-height:1.5;
  padding:6px 0 8px;
  border-bottom:1px solid var(--blue-light);
  margin-bottom:8px;
}
.word-example::before{content:'• ';}

.word-actions{
  display:flex;gap:8px;align-items:center;
}
.action-btn{
  flex:1;height:38px;
  border-radius:var(--radius-sm);
  background:var(--bg);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-mid);
  transition:background .15s,color .15s;
  -webkit-tap-highlight-color:transparent;
}
.action-btn:active{background:var(--blue-light);}
.action-btn.bookmarked{color:var(--blue);}
.action-btn.liked{color:var(--red);}
.action-btn.remove-btn{color:#EF5350;background:#FFF5F5;}
.action-btn.remove-btn:active{background:#FFCDD2;}

/* ── EMPTY STATE ── */
.empty{
  display:flex;flex-direction:column;align-items:center;
  padding:64px 24px;gap:16px;
  color:var(--ink-soft);text-align:center;
}
.empty-icon{
  width:72px;height:72px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;
}
.empty-icon.bm{background:var(--blue-light);}
.empty-icon.lk{background:var(--red-light);}
.empty-title{font-size:1rem;font-weight:700;color:var(--ink);}
.empty-sub{font-size:.85rem;line-height:1.5;max-width:240px;}
.empty-btn{
  margin-top:8px;
  padding:12px 28px;border-radius:24px;
  border:none;cursor:pointer;
  font-family:inherit;font-size:.9rem;font-weight:700;
  color:#fff;background:var(--blue);
  box-shadow:0 4px 12px rgba(33,150,243,.3);
}

/* ── QUIZ BANNER ── */
.quiz-banner{
  background:linear-gradient(135deg,#1565C0,var(--blue));
  border-radius:var(--radius);
  padding:16px 18px;
  display:flex;align-items:center;gap:14px;
  color:#fff;cursor:pointer;
  box-shadow:var(--shadow-md);
  margin-bottom:4px;
}
.quiz-banner-icon{
  width:44px;height:44px;border-radius:12px;
  background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:1.4rem;
}
.quiz-banner-title{font-size:.95rem;font-weight:700;margin-bottom:2px;}
.quiz-banner-sub{font-size:.78rem;opacity:.85;}
.quiz-banner-arrow{margin-left:auto;opacity:.8;}

/* ── PROGRESS ── */
.progress-row{
  display:flex;align-items:center;gap:10px;
  padding:12px 0 6px;
}
.progress-label{font-size:.8rem;font-weight:600;color:var(--ink-mid);flex:1;}
.progress-val{font-size:.8rem;font-weight:700;color:var(--blue);}
.progress-bar-wrap{
  width:100%;height:5px;
  background:var(--blue-mid);border-radius:4px;overflow:hidden;
  margin-bottom:14px;
}
.progress-bar-fill{
  height:100%;border-radius:4px;
  background:var(--blue);
  transition:width .4s ease;
}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:calc(var(--bottom-nav-h) + 16px);left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;
  padding:10px 20px;border-radius:24px;
  font-size:.83rem;font-weight:600;
  pointer-events:none;opacity:0;
  transition:opacity .25s,transform .25s;
  white-space:nowrap;z-index:300;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  height:var(--bottom-nav-h);
  background:var(--white);
  display:flex;
  box-shadow:0 -1px 0 #e8eff8,0 -4px 16px rgba(33,150,243,.07);
  z-index:200;
}
.bottom-nav-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;
  color:var(--ink-soft);font-size:.65rem;font-weight:600;
  text-decoration:none;
  -webkit-tap-highlight-color:transparent;
}
.bottom-nav-item.is-active{color:var(--blue);}

/* ── WORD DETAIL MODAL ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(26,26,46,.55);
  z-index:400;display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-sheet{
  width:100%;background:var(--white);
  border-radius:24px 24px 0 0;
  padding:24px 20px calc(var(--bottom-nav-h) + 24px);
  transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  max-height:90vh;overflow-y:auto;
}
.modal-overlay.open .modal-sheet{transform:translateY(0);}
.modal-handle{
  width:40px;height:4px;border-radius:2px;
  background:#D1D9E6;margin:0 auto 20px;
}
.flash-word{font-size:1.8rem;font-weight:800;color:var(--ink);margin-bottom:4px;}
.flash-level{display:inline-block;background:var(--blue-light);color:var(--blue);font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:10px;margin-bottom:12px;}
.flash-uz{font-size:1.05rem;font-weight:600;color:var(--ink-mid);margin-bottom:12px;}
.flash-example{
  background:var(--bg);border-radius:12px;
  padding:14px 16px;
  font-size:.9rem;font-style:italic;color:var(--ink-mid);
  line-height:1.6;margin-bottom:20px;
}
.flash-example::before{content:'"';font-size:1.2rem;color:var(--blue);}
.flash-example::after{content:'"';font-size:1.2rem;color:var(--blue);}
.flash-actions{display:flex;gap:10px;}
.flash-btn{
  flex:1;height:48px;border-radius:14px;border:none;cursor:pointer;
  font-family:inherit;font-size:.9rem;font-weight:700;
  transition:opacity .15s;
}
.flash-btn:active{opacity:.8;}
.flash-btn.speak{background:var(--blue-light);color:var(--blue);}
.flash-btn.close-btn{background:var(--bg);color:var(--ink-mid);}

/* ── FLASHCARD FULLSCREEN ── */
.fc-screen{
  position:fixed;inset:0;z-index:500;
  background:var(--bg);
  display:none;flex-direction:column;
}
.fc-screen.open{display:flex;}

.fc-topbar{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;background:var(--white);
  box-shadow:var(--shadow-sm);
}
.fc-close{
  width:36px;height:36px;border-radius:50%;
  background:var(--bg);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-mid);flex-shrink:0;
}
.fc-title{font-size:.95rem;font-weight:700;flex:1;}
.fc-progress-text{font-size:.82rem;font-weight:600;color:var(--blue);}

.fc-progress-bar{
  height:4px;background:var(--blue-mid);
}
.fc-progress-fill{
  height:100%;background:var(--blue);
  transition:width .3s ease;
}

.fc-body{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px 20px;
}

/* Flip card */
.fc-card-wrap{
  width:100%;max-width:360px;
  perspective:1000px;
  cursor:pointer;
  margin-bottom:28px;
}
.fc-card{
  width:100%;height:220px;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.4,0,.2,1);
  border-radius:24px;
}
.fc-card.flipped{transform:rotateY(180deg);}
.fc-face{
  position:absolute;inset:0;
  border-radius:24px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}
.fc-front{
  background:linear-gradient(135deg,#1565C0,var(--blue));
  color:#fff;
}
.fc-back{
  background:var(--white);
  box-shadow:var(--shadow-md);
  transform:rotateY(180deg);
}
.fc-front-word{
  font-size:2rem;font-weight:800;
  margin-bottom:8px;text-align:center;
}
.fc-front-hint{
  font-size:.82rem;opacity:.75;
}
.fc-back-uz{
  font-size:1.3rem;font-weight:700;
  color:var(--ink);text-align:center;
  margin-bottom:8px;
}
.fc-back-level{
  display:inline-block;
  background:var(--blue-light);color:var(--blue);
  font-size:.72rem;font-weight:700;
  padding:3px 10px;border-radius:8px;
  margin-bottom:12px;
}
.fc-back-example{
  font-size:.82rem;font-style:italic;
  color:var(--ink-mid);text-align:center;
  line-height:1.5;
}

/* Tap hint */
.fc-tap-hint{
  font-size:.8rem;color:var(--ink-soft);
  margin-bottom:20px;
  display:flex;align-items:center;gap:5px;
}

/* Bottom buttons */
.fc-btns{
  display:flex;gap:12px;width:100%;max-width:360px;
}
.fc-btn{
  flex:1;height:54px;border-radius:16px;border:none;cursor:pointer;
  font-family:inherit;font-size:.88rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .1s,opacity .15s;
}
.fc-btn:active{transform:scale(.96);}
.fc-btn.again{background:#FFEBEE;color:var(--red);}
.fc-btn.good{background:#E8F5E9;color:#2E7D32;}
.fc-btn.skip{background:var(--bg);color:var(--ink-soft);}

/* Result screen */
.fc-result{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:32px 24px;text-align:center;gap:12px;
}
.fc-result-emoji{font-size:4rem;margin-bottom:8px;}
.fc-result-title{font-size:1.3rem;font-weight:800;color:var(--ink);}
.fc-result-sub{font-size:.9rem;color:var(--ink-mid);line-height:1.5;max-width:260px;}
.fc-result-stats{
  display:flex;gap:16px;margin:16px 0;
}
.fc-stat{
  flex:1;background:var(--white);border-radius:16px;
  padding:14px 12px;box-shadow:var(--shadow-sm);
}
.fc-stat-val{font-size:1.4rem;font-weight:800;color:var(--blue);}
.fc-stat-val.red{color:var(--red);}
.fc-stat-val.green{color:#2E7D32;}
.fc-stat-label{font-size:.75rem;color:var(--ink-soft);margin-top:2px;}
.fc-result-btn{
  width:100%;max-width:300px;
  height:52px;border-radius:16px;border:none;cursor:pointer;
  font-family:inherit;font-size:1rem;font-weight:700;
  color:#fff;background:var(--blue);
  box-shadow:0 4px 14px rgba(33,150,243,.3);
  margin-top:8px;
}
</style>
</head>

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

        </div>

let bookmarks = JSON.parse(localStorage.getItem('vz_bookmarks') || '[]');
let likes     = JSON.parse(localStorage.getItem('vz_likes')     || '[]');
let activeTab = 'bookmark';
let searchQ   = '';
let currentModalWord = null;

function saveBookmarks(){ localStorage.setItem('vz_bookmarks', JSON.stringify(bookmarks)); }
function saveLikes(){     localStorage.setItem('vz_likes',     JSON.stringify(likes));     }

// ═══════════════════════════════════════════════════════════
//  TAB SWITCH
// ═══════════════════════════════════════════════════════════
function switchTab(t){
  activeTab = t;
  document.getElementById('tabBm').className = 'seg-tab' + (t==='bookmark' ? ' active-bm' : '');
  document.getElementById('tabLk').className = 'seg-tab' + (t==='like'     ? ' active-lk' : '');
  const count = document.getElementById('topbarCount');
  if(t==='bookmark'){
    count.className='topbar-count';
  } else {
    count.className='topbar-count red';
  }
  searchQ = '';
  document.getElementById('searchInput').value = '';
  render();
}

// ═══════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════
function getList(){
  const ids = activeTab === 'bookmark' ? bookmarks : likes;
  let list = ALL_WORDS.filter(w => ids.includes(w.id));
  if(searchQ){
    const q = searchQ.toLowerCase();
    list = list.filter(w => w.word.toLowerCase().includes(q) || w.uz.toLowerCase().includes(q));
  }
  return list;
}

function render(){
  const list = getList();
  const totalIds = (activeTab==='bookmark' ? bookmarks : likes).length;
  document.getElementById('topbarCount').textContent = list.length + ' ta so\'z';

  const el = document.getElementById('content');

  if(totalIds === 0){
    // Empty state
    const isB = activeTab === 'bookmark';
    el.innerHTML = `
      <div class="empty">
        <div class="empty-icon ${isB?'bm':'lk'}">
          ${isB
            ? '<svg width="32" height="32" viewBox="0 0 24 24" fill="#2196F3"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>'
            : '<svg width="32" height="32" viewBox="0 0 24 24" fill="#E53935"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'}
        </div>
        <div class="empty-title">${isB ? 'Yodlash ro\'yxati bo\'sh' : 'Yoqtirganlari bo\'sh'}</div>
        <div class="empty-sub">${isB
          ? 'Topic vocabulary sahifasida so\'zlar yonidagi 🔖 tugmani bosing'
          : 'Topic vocabulary sahifasida so\'zlar yonidagi ❤️ tugmani bosing'}</div>
        <button class="empty-btn" onclick="location.href='topic.html'">So'zlarga o'tish →</button>
      </div>`;
    return;
  }

  // Progress bar
  const learned = Math.floor(totalIds * 0.3); // placeholder
  const pct = totalIds > 0 ? Math.round(learned/totalIds*100) : 0;

  let html = '';

  // Quiz banner — only for bookmarks
  if(activeTab === 'bookmark' && list.length > 0){
    html += `
    <div class="quiz-banner" onclick="openFlashcards()">
      <div class="quiz-banner-icon">🧠</div>
      <div>
        <div class="quiz-banner-title">Flashcard bilan yodla</div>
        <div class="quiz-banner-sub">${list.length} ta so'z • Bosing va boshlang!</div>
      </div>
      <svg class="quiz-banner-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </div>`;
  }

  // Cards
  html += list.map((w, i) => {
    const isB = bookmarks.includes(w.id);
    const isL = likes.includes(w.id);
    return `
    <div class="word-card" onclick="openModal(${w.id})">
      <div class="word-header">
        <span class="word-num">${i+1}.</span>
        <span class="word-en">${w.word}</span>
        <span class="word-dash"> – </span>
        <span class="word-uz">${w.uz}</span>
        <span class="level-badge">${w.level}</span>
        <span class="word-topic">${w.topic}</span>
      </div>
      ${w.example ? `<div class="word-example">${w.example}</div>` : ''}
      <div class="word-actions" onclick="event.stopPropagation()">
        <button class="action-btn" onclick="speakWord('${w.word.replace(/'/g,"\\'")}')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
        <button class="action-btn${isB?' bookmarked':''}" id="bm-${w.id}" onclick="toggleBookmark(${w.id})">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="${isB?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button class="action-btn${isL?' liked':''}" id="lk-${w.id}" onclick="toggleLike(${w.id})">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="${isL?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        <button class="action-btn remove-btn" onclick="removeWord(${w.id})" title="Olib tashlash">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>
    </div>`;
  }).join('');

  el.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════════════════
function toggleBookmark(id){
  const idx = bookmarks.indexOf(id);
  if(idx===-1){ bookmarks.push(id); showToast('📚 Yodlash ro\'yxatiga qo\'shildi!'); }
  else { bookmarks.splice(idx,1); showToast('Bookmark olib tashlandi'); }
  saveBookmarks();
  render();
}

function toggleLike(id){
  const idx = likes.indexOf(id);
  if(idx===-1){ likes.push(id); showToast('❤️ Yoqtirganlarga qo\'shildi!'); }
  else { likes.splice(idx,1); showToast('Yoqtirganlardan olib tashlandi'); }
  saveLikes();
  render();
}

function removeWord(id){
  if(activeTab==='bookmark'){
    bookmarks = bookmarks.filter(x=>x!==id);
    saveBookmarks();
    showToast('🗑️ Yodlash ro\'yxatidan olib tashlandi');
  } else {
    likes = likes.filter(x=>x!==id);
    saveLikes();
    showToast('🗑️ Yoqtirganlardan olib tashlandi');
  }
  render();
}

function speakWord(word){
  if('speechSynthesis' in window){
    const u = new SpeechSynthesisUtterance(word);
    u.lang='en-US'; u.rate=0.9;
    speechSynthesis.speak(u);
  }
}

function openModal(id){
  const w = ALL_WORDS.find(x=>x.id===id);
  if(!w) return;
  currentModalWord = w;
  document.getElementById('modalWord').textContent    = w.word;
  document.getElementById('modalLevel').textContent   = w.level + ' · ' + w.topic;
  document.getElementById('modalUz').textContent      = w.uz;
  document.getElementById('modalExample').textContent = w.example || '';
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e){
  if(!e || e.target===document.getElementById('modalOverlay')){
    document.getElementById('modalOverlay').classList.remove('open');
    currentModalWord = null;
  }
}

function speakCurrent(){
  if(currentModalWord) speakWord(currentModalWord.word);
}

// ═══════════════════════════════════════════════════════════
//  FLASHCARD ENGINE
// ═══════════════════════════════════════════════════════════
let fcWords    = [];
let fcIndex    = 0;
let fcFlipped  = false;
let fcGood     = 0;
let fcAgain    = 0;
let fcSkip     = 0;

function openFlashcards(){
  const ids = bookmarks;
  fcWords = ALL_WORDS.filter(w => ids.includes(w.id));
  if(!fcWords.length){ showToast('Hali yodlash ro\'yxati bo\'sh!'); return; }
  // shuffle
  fcWords = fcWords.slice().sort(()=>Math.random()-.5);
  fcIndex  = 0;
  fcGood   = 0;
  fcAgain  = 0;
  fcSkip   = 0;

  document.getElementById('fcScreen').classList.add('open');
  document.getElementById('fcResult').style.display = 'none';
  document.getElementById('fcBody').style.display   = 'flex';
  showFcCard();
}

function showFcCard(){
  const w = fcWords[fcIndex];
  if(!w) return;

  // reset flip
  fcFlipped = false;
  const card = document.getElementById('fcCard');
  card.classList.remove('flipped');

  document.getElementById('fcWord').textContent    = w.word;
  document.getElementById('fcUz').textContent      = w.uz;
  document.getElementById('fcLevel').textContent   = w.level + ' · ' + w.topic;
  document.getElementById('fcExample').textContent = w.example || '';

  const total = fcWords.length;
  const cur   = fcIndex + 1;
  document.getElementById('fcProgressText').textContent = cur + ' / ' + total;
  document.getElementById('fcProgressFill').style.width = (cur / total * 100) + '%';
  document.getElementById('fcTitle').textContent = 'Flashcard • ' + w.topic;
  document.getElementById('fcHint').style.display = 'flex';
}

function flipCard(){
  fcFlipped = !fcFlipped;
  document.getElementById('fcCard').classList.toggle('flipped', fcFlipped);
  if(fcFlipped){
    document.getElementById('fcHint').style.display = 'none';
    // speak automatically on flip
    speakWord(fcWords[fcIndex].word);
  }
}

function fcAnswer(type){
  if(!fcFlipped){
    // must flip first
    flipCard();
    showToast('Avval kartochkani aylantiring 👆');
    return;
  }
  if(type==='good')  fcGood++;
  if(type==='again') fcAgain++;
  if(type==='skip')  fcSkip++;

  fcIndex++;
  if(fcIndex >= fcWords.length){
    showFcResult();
  } else {
    showFcCard();
  }
}

function showFcResult(){
  document.getElementById('fcBody').style.display   = 'none';
  document.getElementById('fcResult').style.display = 'flex';

  const total = fcWords.length;
  const pct   = Math.round(fcGood / total * 100);
  let emoji = '🎉', title = 'Barakalla!';
  if(pct === 100){ emoji='🏆'; title='Mukammal natija!'; }
  else if(pct >= 70){ emoji='🎉'; title='Yaxshi natija!'; }
  else if(pct >= 40){ emoji='💪'; title='Davom eting!'; }
  else { emoji='📚'; title='Ko\'proq mashq kerak'; }

  document.getElementById('fcResultEmoji').textContent  = emoji;
  document.getElementById('fcResultTitle').textContent  = title;
  document.getElementById('fcResultSub').textContent    = `${total} ta so'zdan ${fcGood} tasini bildingiz (${pct}%)`;
  document.getElementById('fcGoodCount').textContent    = fcGood;
  document.getElementById('fcAgainCount').textContent   = fcAgain;
  document.getElementById('fcSkipCount').textContent    = fcSkip;
  document.getElementById('fcProgressFill').style.width = '100%';
}

function restartFlashcards(){
  fcWords = fcWords.sort(()=>Math.random()-.5);
  fcIndex = fcGood = fcAgain = fcSkip = 0;
  document.getElementById('fcResult').style.display = 'none';
  document.getElementById('fcBody').style.display   = 'flex';
  showFcCard();
}

function closeFlashcards(){
  document.getElementById('fcScreen').classList.remove('open');
}

//  INIT — check URL param
// ═══════════════════════════════════════════════════════════
const urlTab = new URLSearchParams(location.search).get('tab');
if(urlTab === 'like') switchTab('like');
else render();
</script>
