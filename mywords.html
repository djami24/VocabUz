      </div>
    </div>

        <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.auth().onAuthStateChanged(function(user){
  if(!user){ location.href='login.html'; return; }
  loadMyWords(user.uid);
});

function loadMyWords(uid){
  db.collection('users').doc(uid).get().then(function(doc){
    document.getElementById('loader').style.display='none';
    if(!doc.exists){ renderEmpty(); return; }
    var data = doc.data();
    var bookmarks = data.bookmarks || [];
    var likes = data.likes || [];
    document.getElementById('statSaved').textContent = bookmarks.length + ' ta so\'z';
    document.getElementById('statLiked').textContent = likes.length + ' ta so\'z';

    if(!bookmarks.length){
      document.getElementById('savedList').innerHTML='<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><p>Hali hech qanday so\'z saqlanmagan</p></div>';
      return;
    }

    // Batch fetch saved words (max 10 per query in Firestore)
    fetchWordsByIds(bookmarks, 'savedList');
    if(likes.length){
      document.getElementById('likedTitle').style.display='';
      fetchWordsByIds(likes, 'likedList');
    }
  });
}

function fetchWordsByIds(ids, containerId){
  // Firestore 'in' query max 30
  var chunks = [];
  for(var i=0; i<ids.length; i+=30) chunks.push(ids.slice(i,i+30));
  var all = [];
  var pending = chunks.length;
  chunks.forEach(function(chunk){
    db.collection('words').where(firebase.firestore.FieldPath.documentId(),'in',chunk).get()
      .then(function(snap){
        snap.docs.forEach(function(d){ all.push(Object.assign({id:d.id}, d.data())); });
        if(--pending === 0) renderWordCards(all, containerId);
      });
  });
}

function renderWordCards(words, containerId){
  if(!words.length){ document.getElementById(containerId).innerHTML=''; return; }
  var html = words.map(function(w){
    return '<div class="word-list-row" onclick="location.href=\'word.html?id='+w.id+'\'">'
      + '<div class="word-list-num" style="min-width:auto;padding:0 6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>'
      + '</div>'
      + '<div style="flex:1"><div class="word-list-word">'+escHtml(w.word)+'</div>'
      + '<div style="font-size:.8rem;color:var(--ink-soft)">'+escHtml(w.translation)+'</div></div>'
      + (w.level?'<span class="word-list-badge">'+w.level+'</span>':'')
      + '</div>';
  }).join('');
  document.getElementById(containerId).innerHTML = html;
}

function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
