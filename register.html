<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ro'yxatdan o'tish — VocaabUZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-page">
  <div style="width:100%;max-width:360px;margin:0 auto 8px;">
    <a href="login.html" style="display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#1DA1F2,#0D8AD4);color:#fff;font-size:.82rem;font-weight:600;text-decoration:none;padding:7px 14px;border-radius:8px;" onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">Orqaga</a>
  </div>
  <div class="auth-logo">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    </svg>
  </div>
  <div class="auth-title">VocaabUZ</div>
  <div class="auth-sub">Yangi hisob yarating</div>

  <div class="auth-card">
    <div class="form-group">
      <label class="form-label">Ism Familiya</label>
      <input class="form-input" type="text" id="nameInput" placeholder="Alisher Navoiy" autocomplete="name">
      <div class="form-error" id="nameErr"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-input" type="email" id="emailInput" placeholder="email@example.com" autocomplete="email">
      <div class="form-error" id="emailErr"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Parol</label>
      <input class="form-input" type="password" id="passInput" placeholder="Kamida 6 ta belgi" autocomplete="new-password">
      <div class="form-error" id="passErr"></div>
    </div>
    <div class="form-error" id="globalErr" style="margin-bottom:12px"></div>
    <button class="btn-primary" id="regBtn" onclick="doRegister()">Ro'yxatdan o'tish</button>
    <div class="auth-switch">
      Hisobingiz bormi? <a href="login.html">Kirish</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.auth().onAuthStateChanged(function(user){
  if(user) location.href = 'index.html';
});

function doRegister(){
  var name  = document.getElementById('nameInput').value.trim();
  var email = document.getElementById('emailInput').value.trim();
  var pass  = document.getElementById('passInput').value;
  var btn   = document.getElementById('regBtn');
  var gErr  = document.getElementById('globalErr');
  gErr.textContent = '';
  document.getElementById('nameErr').textContent = '';
  document.getElementById('emailErr').textContent = '';
  document.getElementById('passErr').textContent = '';

  var ok = true;
  if(!name)       { document.getElementById('nameErr').textContent  = 'Ismingizni kiriting'; ok = false; }
  if(!email)      { document.getElementById('emailErr').textContent = 'Email kiriting'; ok = false; }
  if(pass.length < 6){ document.getElementById('passErr').textContent = 'Parol kamida 6 ta belgi bo\'lishi kerak'; ok = false; }
  if(!ok) return;

  btn.disabled = true;
  btn.textContent = 'Yuklanmoqda…';

  firebase.auth().createUserWithEmailAndPassword(email, pass)
    .then(function(cred){
      return cred.user.updateProfile({ displayName: name })
        .then(function(){
          // Firestore da user profil yaratish
          return db.collection('users').doc(cred.user.uid).set({
            name: name,
            email: email,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            bookmarks: [],
            likes: []
          });
        });
    })
    .then(function(){ location.href = 'index.html'; })
    .catch(function(err){
      btn.disabled = false;
      btn.textContent = 'Ro\'yxatdan o\'tish';
      var msg = 'Xatolik yuz berdi';
      if(err.code === 'auth/email-already-in-use') msg = 'Bu email allaqachon ro\'yxatdan o\'tgan';
      if(err.code === 'auth/invalid-email')        msg = 'Email noto\'g\'ri';
      if(err.code === 'auth/weak-password')        msg = 'Parol juda oddiy';
      gErr.textContent = msg;
    });
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Enter') doRegister();
});
</script>
</body>
</html>
