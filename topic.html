<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Topic Vocabulary — VocabUZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#2196F3; --blue-deep:#1565C0; --blue-light:#E3F2FD; --blue-mid:#BBDEFB;
  --green:#22C55E; --green-light:#DCFCE7; --green-deep:#16A34A;
  --red:#EF4444; --red-light:#FEE2E2;
  --amber:#F59E0B; --amber-light:#FEF3C7;
  --ink:#1A1A2E; --ink-mid:#5A6070; --ink-soft:#9AA0AD;
  --white:#FFFFFF; --bg:#F0F6FF;
  --shadow-sm:0 1px 4px rgba(33,150,243,.10);
  --shadow-md:0 4px 16px rgba(33,150,243,.15);
  --radius:16px; --radius-sm:12px; --bottom-nav-h:66px;
}
html,body{min-height:100%;background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);}

/* ── TOP BAR ── */
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;gap:10px;}
.back-btn{width:38px;height:38px;border-radius:50%;background:var(--white);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);color:var(--ink-mid);flex-shrink:0;}
.topbar-title{font-size:1.05rem;font-weight:700;flex:1;}
.topbar-count{font-size:.78rem;font-weight:600;background:var(--blue-light);color:var(--blue);padding:4px 10px;border-radius:20px;}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--bottom-nav-h);background:var(--white);display:flex;box-shadow:0 -1px 0 #e8eff8,0 -4px 16px rgba(33,150,243,.07);z-index:200;}
.bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-soft);font-size:.65rem;font-weight:600;text-decoration:none;-webkit-tap-highlight-color:transparent;}
.bottom-nav-item.is-active{color:var(--blue);}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--bottom-nav-h)+16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:24px;font-size:.83rem;font-weight:600;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap;z-index:500;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ══════════════════════════
   VIEW 1: MAVZU KARTOCHKALARI
══════════════════════════ */
#viewTopics{padding:0 0 calc(var(--bottom-nav-h)+20px);}
.topics-grid{display:flex;flex-direction:column;gap:12px;padding:0 16px;}
.topic-card{
  background:var(--white);border-radius:var(--radius);
  padding:18px 16px;box-shadow:var(--shadow-sm);
  cursor:pointer;transition:box-shadow .15s,transform .12s;
  -webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;gap:14px;
  position:relative;overflow:hidden;
}
.topic-card:active{transform:scale(.98);box-shadow:var(--shadow-md);}
.topic-card.locked{opacity:.55;cursor:default;}
.topic-card.completed{border-left:4px solid var(--green);}
.topic-card-progress-bar{
  position:absolute;bottom:0;left:0;height:3px;
  background:linear-gradient(90deg,var(--blue),var(--blue-deep));
  transition:width .4s ease;
}
.topic-icon{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0;}
.topic-info{flex:1;}
.topic-name{font-size:1rem;font-weight:800;color:var(--ink);margin-bottom:3px;}
.topic-meta{font-size:.78rem;color:var(--ink-soft);display:flex;align-items:center;gap:8px;}
.topic-badge{
  font-size:.72rem;font-weight:700;
  padding:3px 9px;border-radius:20px;
  background:var(--blue-light);color:var(--blue);
}
.topic-badge.done{background:var(--green-light);color:var(--green-deep);}
.topic-badge.locked{background:#F1F5F9;color:var(--ink-soft);}
.lock-icon{color:var(--ink-soft);}

/* ══════════════════════════
   VIEW 2: SO'ZLAR RO'YXATI
══════════════════════════ */
#viewWords{display:none;padding-bottom:calc(var(--bottom-nav-h)+24px);}
.words-list{padding:0 16px;display:flex;flex-direction:column;gap:10px;}
.word-card{background:var(--white);border-radius:var(--radius);padding:14px 16px 12px;box-shadow:var(--shadow-sm);transition:box-shadow .15s;}
.word-card.learned-card{border-left:3px solid var(--green);}
.word-header{display:flex;align-items:baseline;gap:6px;margin-bottom:4px;}
.word-num{font-size:.82rem;font-weight:700;color:var(--blue);flex-shrink:0;min-width:22px;}
.word-en{font-size:.97rem;font-weight:700;color:var(--ink);}
.word-dash{color:var(--ink-mid);font-size:.92rem;font-weight:400;}
.word-uz{font-size:.9rem;font-weight:500;color:var(--ink-mid);flex:1;}
.level-badge{display:inline-flex;align-items:center;background:var(--blue-light);color:var(--blue);font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:8px;margin-left:4px;vertical-align:middle;}
.word-example{font-size:.84rem;color:var(--ink-mid);font-style:italic;line-height:1.5;padding:6px 0 8px;border-bottom:1px solid var(--blue-light);margin-bottom:8px;}
.word-example::before{content:'• ';}
.word-actions{display:flex;gap:8px;align-items:center;}
.btn-learned{flex:1;height:38px;border-radius:var(--radius-sm);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-size:.82rem;font-weight:700;font-family:inherit;background:var(--green-light);color:var(--green-deep);transition:background .15s,color .15s;-webkit-tap-highlight-color:transparent;}
.btn-learned.done{background:var(--green);color:#fff;}
.btn-icon{width:38px;height:38px;border-radius:var(--radius-sm);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--blue-light);color:var(--ink-soft);transition:background .15s,color .15s;-webkit-tap-highlight-color:transparent;flex-shrink:0;}
.btn-icon.bookmarked{background:#EFF6FF;color:var(--blue);}
.btn-icon.liked{background:var(--red-light);color:var(--red);}

/* Progress banner */
.progress-banner{margin:0 16px 14px;background:var(--white);border-radius:var(--radius-sm);padding:14px 16px;box-shadow:var(--shadow-sm);}
.progress-banner-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.progress-banner-title{font-size:.85rem;font-weight:700;}
.progress-banner-pct{font-size:.85rem;font-weight:800;color:var(--blue);}
.progress-track{height:8px;background:var(--blue-light);border-radius:8px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-deep));border-radius:8px;transition:width .4s ease;}
.test-ready-banner{
  margin:0 16px 14px;
  background:linear-gradient(135deg,var(--green-deep),var(--green));
  border-radius:var(--radius-sm);padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  box-shadow:0 4px 14px rgba(34,197,94,.3);
}
.test-ready-txt{color:#fff;}
.test-ready-title{font-size:.95rem;font-weight:800;margin-bottom:2px;}
.test-ready-sub{font-size:.78rem;opacity:.85;}
.test-ready-btn{background:rgba(255,255,255,.25);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap;}

/* ══════════════════════════
   VIEW 3: TEST
══════════════════════════ */
#viewTest{display:none;position:fixed;inset:0;z-index:400;background:var(--bg);flex-direction:column;}
#viewTest.open{display:flex;}

.test-topbar{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--white);box-shadow:var(--shadow-sm);flex-shrink:0;}
.test-close{width:36px;height:36px;border-radius:50%;background:var(--bg);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-mid);}
.test-topbar-title{font-size:.95rem;font-weight:700;flex:1;}
.test-counter{font-size:.82rem;font-weight:700;color:var(--blue);}
.test-progress-bar{height:4px;background:var(--blue-mid);flex-shrink:0;}
.test-progress-fill{height:100%;background:var(--blue);transition:width .3s ease;}

.test-body{flex:1;overflow-y:auto;padding:24px 16px 32px;display:flex;flex-direction:column;align-items:center;}
.test-question{
  width:100%;max-width:420px;
  background:linear-gradient(135deg,var(--blue-deep),var(--blue));
  border-radius:20px;padding:28px 22px;
  text-align:center;color:#fff;margin-bottom:24px;
}
.test-q-label{font-size:.75rem;font-weight:700;opacity:.7;letter-spacing:.5px;text-transform:uppercase;margin-bottom:14px;}
.test-q-word{font-size:2rem;font-weight:900;letter-spacing:-.5px;margin-bottom:6px;}
.test-q-topic{font-size:.78rem;opacity:.7;}

.test-error-info{
  width:100%;max-width:420px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:16px;
  font-size:.82rem;font-weight:600;
  color:var(--red);
}
.test-error-dot{width:10px;height:10px;border-radius:50%;background:var(--red);}
.test-error-dot.empty{background:var(--red-light);border:2px solid var(--red);}

.test-options{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;}
.test-opt{
  width:100%;padding:15px 18px;border-radius:var(--radius-sm);
  border:2px solid var(--blue-light);background:var(--white);
  font-family:inherit;font-size:.9rem;font-weight:600;color:var(--ink);
  cursor:pointer;text-align:left;transition:all .15s;
  -webkit-tap-highlight-color:transparent;
}
.test-opt:active:not([disabled]){background:var(--blue-light);}
.test-opt.correct{background:var(--green-light)!important;border-color:var(--green)!important;color:var(--green-deep)!important;}
.test-opt.wrong{background:var(--red-light)!important;border-color:var(--red)!important;color:var(--red)!important;}
.test-opt.show-correct{background:var(--green-light)!important;border-color:var(--green)!important;}
.test-opt[disabled]{cursor:default;}

.test-next-btn{
  width:100%;max-width:420px;
  height:52px;margin-top:18px;
  border-radius:var(--radius);border:none;cursor:pointer;
  font-family:inherit;font-size:.97rem;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--blue-deep),var(--blue));
  box-shadow:0 4px 14px rgba(33,150,243,.3);
  display:none;
}

/* ── TEST RESULT ── */
.test-result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;gap:14px;}
.test-result-emoji{font-size:4.5rem;}
.test-result-title{font-size:1.4rem;font-weight:900;color:var(--ink);}
.test-result-sub{font-size:.9rem;color:var(--ink-mid);line-height:1.6;max-width:280px;}
.test-result-stats{display:flex;gap:10px;width:100%;max-width:340px;margin:8px 0;}
.trs{flex:1;background:var(--white);border-radius:14px;padding:14px 8px;box-shadow:var(--shadow-sm);text-align:center;}
.trs-val{font-size:1.6rem;font-weight:900;}
.trs-val.green{color:var(--green);}
.trs-val.red{color:var(--red);}
.trs-lbl{font-size:.72rem;color:var(--ink-soft);margin-top:3px;}
.test-result-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;margin-top:6px;}
.trb{width:100%;height:52px;border-radius:var(--radius);border:none;cursor:pointer;font-family:inherit;font-size:.97rem;font-weight:700;-webkit-tap-highlight-color:transparent;}
.trb.primary{color:#fff;background:linear-gradient(135deg,var(--blue-deep),var(--blue));box-shadow:0 4px 14px rgba(33,150,243,.3);}
.trb.secondary{background:#F1F5F9;color:var(--ink-mid);}
.trb.green{color:#fff;background:linear-gradient(135deg,var(--green-deep),var(--green));box-shadow:0 4px 14px rgba(34,197,94,.3);}

/* Spinner */
.spinner-wrap{display:flex;align-items:center;justify-content:center;padding:48px 0;}
.spinner{width:36px;height:36px;border:3px solid var(--blue-mid);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

// ─── MAVZULAR TARTIBI ─────────────────────────────────────
const TOPIC_ORDER = ["Ta'lim","Sog'liq","Biznes","Hissiyotlar","Munosabatlar","Texnologiya","Atrof-muhit","Ovqat"];
const TOPIC_EMOJI = {"Ta'lim":'📚',"Sog'liq":'🏥',"Biznes":'💼',"Hissiyotlar":'😊',"Munosabatlar":'🤝',"Texnologiya":'💻',"Atrof-muhit":'🌿',"Ovqat":'🍽️'};
const TOPIC_COLOR = {"Ta'lim":'#E3F2FD',"Sog'liq":'#FCE4EC',"Biznes":'#E8F5E9',"Hissiyotlar":'#FFF8E1',"Munosabatlar":'#F3E5F5',"Texnologiya":'#E0F7FA',"Atrof-muhit":'#F1F8E9',"Ovqat":'#FBE9E7'};

// ─── STATE ────────────────────────────────────────────────
let learnedIds   = [];
let passedTopics = [];   // testdan o'tgan mavzular (localStorage)
let bookmarks    = [];   // yodlash ro'yxati
let likes        = [];   // yoqtirganlar
let currentUser  = null;
let currentTopic = null; // Ochiq mavzu

// ─── YORDAMCHI FUNKSIYALAR ────────────────────────────────
function topicWords(topic){ return ALL_WORDS.filter(w=>w.topic===topic); }
function topicLearnedCount(topic){ return topicWords(topic).filter(w=>learnedIds.includes(w.id)).length; }
function isTopicFull(topic){ return topicLearnedCount(topic)===topicWords(topic).length; }
function isTopicPassed(topic){ return passedTopics.includes(topic); }
function isTopicUnlocked(topic){
  const idx = TOPIC_ORDER.indexOf(topic);
  if(idx===0) return true;
  return isTopicPassed(TOPIC_ORDER[idx-1]);
}

function saveState(){
  localStorage.setItem('vz_learned',    JSON.stringify(learnedIds));
  localStorage.setItem('vz_passed',     JSON.stringify(passedTopics));
  localStorage.setItem('vz_bookmarks',  JSON.stringify(bookmarks));
  localStorage.setItem('vz_likes',      JSON.stringify(likes));
}
function loadLocalState(){
  learnedIds   = JSON.parse(localStorage.getItem('vz_learned')   || '[]').map(Number);
  passedTopics = JSON.parse(localStorage.getItem('vz_passed')    || '[]');
  bookmarks    = JSON.parse(localStorage.getItem('vz_bookmarks') || '[]');
  likes        = JSON.parse(localStorage.getItem('vz_likes')     || '[]');
}

// ─── FIREBASE ────────────────────────────────────────────
firebase.auth().onAuthStateChanged(function(user){
  if(!user){ location.href='login.html'; return; }
  currentUser = user;
  loadLocalState();
  db.collection('users').doc(user.uid).get().then(function(doc){
    if(doc.exists){
      if(doc.data().learned)    learnedIds   = doc.data().learned.map(Number);
      if(doc.data().passed)     passedTopics = doc.data().passed;
      if(doc.data().bookmarks)  bookmarks    = doc.data().bookmarks;
      if(doc.data().likes)      likes        = doc.data().likes;
    }
    saveState();
    renderTopics();
  }).catch(function(){
    renderTopics();
  });
});

function saveToFirestore(){
  if(!currentUser) return;
  const ref = db.collection('users').doc(currentUser.uid);
  const data = { learned: learnedIds, passed: passedTopics, bookmarks: bookmarks, likes: likes };
  ref.update(data).catch(function(){ ref.set(data, {merge:true}); });
}

// ─── TOAST ───────────────────────────────────────────────
let toastTimer;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove('show');},2200);
}

function renderTopics(){
  const total = learnedIds.length;
  document.getElementById('topbarTitle').textContent = 'Topic Vocabulary';
  document.getElementById('topbarCount').textContent = total+" ta o'rganilgan";

  let html='';
  TOPIC_ORDER.forEach(function(topic){
    const words    = topicWords(topic);
    const learned  = topicLearnedCount(topic);
    const total    = words.length;
    const pct      = Math.round(learned/total*100);
    const full     = isTopicFull(topic);
    const passed   = isTopicPassed(topic);
    const unlocked = isTopicUnlocked(topic);
    const emoji    = TOPIC_EMOJI[topic]||'📖';
    const color    = TOPIC_COLOR[topic]||'#E3F2FD';

    let badgeHtml, rightHtml;
    if(passed){
      badgeHtml=`<span class="topic-badge done">✓ O'tildi</span>`;
      rightHtml=`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;
    } else if(!unlocked){
      badgeHtml=`<span class="topic-badge locked">🔒 Qulflangan</span>`;
      rightHtml=`<svg class="lock-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
    } else if(full){
      badgeHtml=`<span class="topic-badge" style="background:var(--amber-light);color:var(--amber)">📝 Test tayyor!</span>`;
      rightHtml=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>`;
    } else {
      badgeHtml=`<span class="topic-badge">${learned}/${total}</span>`;
      rightHtml=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-soft)" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>`;
    }

    const cardClass = 'topic-card'+(passed?' completed':'')+((!unlocked)?' locked':'');
    const clickAttr = unlocked ? `onclick="openTopic(TOPIC_ORDER[${TOPIC_ORDER.indexOf(topic)}])"` : '';

    html+=`
      <div class="${cardClass}" ${clickAttr}>
        <div class="topic-icon" style="background:${color}">${emoji}</div>
        <div class="topic-info">
          <div class="topic-name">${topic}</div>
          <div class="topic-meta">${total} ta so'z &bull; ${pct}% ${badgeHtml}</div>
        </div>
        ${rightHtml}
        <div class="topic-card-progress-bar" style="width:${pct}%"></div>
      </div>`;
  });
  document.getElementById('topicsGrid').innerHTML = html;
}

function openTopic(topic){
  currentTopic = topic;
  document.getElementById('viewTopics').style.display='none';
  const vw = document.getElementById('viewWords');
  vw.style.display='block';
  vw.scrollTop = 0;
  document.getElementById('topbarTitle').textContent = TOPIC_EMOJI[topic]+' '+topic;
  renderWords();
}

function goBack(){
  if(document.getElementById('viewWords').style.display==='block'){
    document.getElementById('viewWords').style.display='none';
    document.getElementById('viewTopics').style.display='block';
    currentTopic=null;
    document.getElementById('topbarTitle').textContent='Topic Vocabulary';
    document.getElementById('topbarCount').textContent=learnedIds.length+" ta o'rganilgan";
    renderTopics();
  } else {
    history.back();
  }
}

function renderWords(){

  const words   = topicWords(topic);

  const total   = words.length;
  const pct     = Math.round(learned/total*100);

  document.getElementById('topbarCount').textContent = learned+'/'+total;

  // Progress banner

  if(passed){
    bannerHtml=`<div style="margin:0 16px 14px;background:var(--green-light);border-radius:var(--radius-sm);padding:14px 16px;display:flex;align-items:center;gap:12px;">

      <div><div style="font-size:.92rem;font-weight:800;color:var(--green-deep)">Mavzu o'tildi! 🎉</div><div style="font-size:.78rem;color:var(--green-deep);opacity:.8">Barcha so'zlarni yaxshi bilasiz</div></div>
    </div>`;
  } else if(full){
    bannerHtml=`<div class="test-ready-banner" onclick="startTest()">
      <div class="test-ready-txt"><div class="test-ready-title">🎯 Test boshlashga tayyor!</div><div class="test-ready-sub">Barcha ${total} ta so'zni o'rgandingiz</div></div>
      <button class="test-ready-btn">Testni boshlash →</button>
    </div>`;
  } else {
    bannerHtml=`<div class="progress-banner">
      <div class="progress-banner-row"><span class="progress-banner-title">O'rganish jarayoni</span><span class="progress-banner-pct">${pct}%</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>`;
  }
  document.getElementById('progressBanner').innerHTML=bannerHtml;

  // So'zlar
  let html=words.map(function(w,i){
    const isLearned  = learnedIds.includes(w.id);
    const isBookmark = bookmarks.includes(w.id);
    const isLiked    = likes.includes(w.id);
    return `<div class="word-card${isLearned?' learned-card':''}" id="card-${w.id}">
      <div class="word-header">

        <span class="word-dash"> – </span>
        <span class="word-uz">${w.uz}</span>
        <span class="level-badge">${w.level}</span>

      <div class="word-actions">
        <button class="btn-learned${isLearned?' done':''}" id="lrn-${w.id}" onclick="markLearned(${w.id})">
          ${isLearned
            ?'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> O\'rgandim'
            :'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg> O\'rgandim'}
        </button>
        <button class="btn-icon${isBookmark?' bookmarked':''}" id="bm-${w.id}" onclick="toggleBookmark(${w.id})" title="Yodlash">

        </button>
        <button class="btn-icon${isLiked?' liked':''}" id="lk-${w.id}" onclick="toggleLike(${w.id})" title="Yoqtirganlar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="${isLiked?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>

  }).join('');
  document.getElementById('wordsList').innerHTML = html;
}

function markLearned(id){
  if(!currentUser) return;
  const numId=Number(id);
  const idx=learnedIds.indexOf(numId);
  const isNew=idx===-1;
  if(isNew){ learnedIds.push(numId); showToast("✅ O'rgandim! So'z saqlandi!"); }
  else      { learnedIds.splice(idx,1); showToast("↩️ O'rganilganlardan olib tashlandi"); }
  saveState();
  saveToFirestore();
  renderWords();
}

function toggleBookmark(id){
  const numId=Number(id);
  const idx=bookmarks.indexOf(numId);
  if(idx===-1){ bookmarks.push(numId); showToast("📚 Yodlash ro'yxatiga qo'shildi!"); }
  else        { bookmarks.splice(idx,1); showToast("Yodlashdan olib tashlandi"); }
  saveState();
  saveToFirestore();
  // Faqat shu kartochkani yangilash
  const bm=document.getElementById('bm-'+numId);
  if(bm){
    const active=bookmarks.includes(numId);
    bm.className='btn-icon'+(active?' bookmarked':'');
    bm.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="${active?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
  }
}

function toggleLike(id){
  const numId=Number(id);
  const idx=likes.indexOf(numId);
  if(idx===-1){ likes.push(numId); showToast("❤️ Yoqtirganlarga qo'shildi!"); }
  else        { likes.splice(idx,1); showToast("Yoqtirganlardan olib tashlandi"); }
  saveState();
  saveToFirestore();
  // Faqat shu kartochkani yangilash
  const lk=document.getElementById('lk-'+numId);
  if(lk){
    const active=likes.includes(numId);
    lk.className='btn-icon'+(active?' liked':'');
    lk.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="${active?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
  }
}

// ════════════════════════════════════════
//  VIEW 3: TEST
// ════════════════════════════════════════
// Test qoidasi: 10 savol, har savol 4 variant (bittasi to'g'ri),
// 2 ta xato qilsa → failed (qayta boshlash), 0-1 xato → passed
const MAX_ERRORS = 1;  // shu yoki kamroq xato = o'tdi

let testWords   = [];
let testIdx     = 0;
let testErrors  = 0;
let testCorrect = 0;
let testAnswered= false;

function startTest(){
  const topic = currentTopic;
  const words  = topicWords(topic).slice();
  // 10 ta savol olish (yoki mavzuda kamroq bo'lsa hammasi)
  const shuffled = words.sort(function(){return Math.random()-.5;}).slice(0,Math.min(10,words.length));
  testWords   = shuffled;
  testIdx     = 0;
  testErrors  = 0;
  testCorrect = 0;
  testAnswered= false;

  document.getElementById('testTitle').textContent = TOPIC_EMOJI[topic]+' '+topic+' testi';
  document.getElementById('viewTest').classList.add('open');
  renderTestQuestion();
}

function closeTest(){
  document.getElementById('viewTest').classList.remove('open');
}

function renderTestQuestion(){
  if(testIdx>=testWords.length){
    renderTestResult();
    return;
  }
  const w      = testWords[testIdx];
  const total  = testWords.length;
  const cur    = testIdx+1;
  testAnswered = false;

  document.getElementById('testCounter').textContent = cur+'/'+total;
  document.getElementById('testFill').style.width    = (cur/total*100)+'%';

  // To'g'ri javob + 3 ta noto'g'ri
  const pool    = ALL_WORDS.filter(function(x){return x.id!==w.id;});
  const wrong3  = pool.sort(function(){return Math.random()-.5;}).slice(0,3);
  const options = [w,...wrong3].sort(function(){return Math.random()-.5;});

  // Xato indikatorlari
  let errDots='';
  for(let i=0;i<2;i++){
    errDots+=`<div class="test-error-dot${i<testErrors?'':' empty'}"></div>`;
  }

  let optsHtml=options.map(function(opt){
    return `<button class="test-opt" onclick="checkAnswer(${opt.id},${w.id},this)">${opt.uz}</button>`;
  }).join('');

  document.getElementById('testBody').innerHTML=`
    <div class="test-question">
      <div class="test-q-label">Tarjimasini tanlang</div>
      <div class="test-q-word">${w.word}</div>
      <div class="test-q-topic">${TOPIC_EMOJI[w.topic]||''} ${w.topic} · ${w.level}</div>
    </div>
    <div class="test-error-info">
      Xato: ${errDots}
      <span style="margin-left:4px;color:var(--ink-soft)">(2 ta xatoda test o'tkazib yuboriladi)</span>
    </div>
    <div class="test-options">${optsHtml}</div>
    <button class="test-next-btn" id="testNextBtn" onclick="nextQuestion()">
      ${testIdx+1<testWords.length ? 'Keyingi savol →' : 'Natijani ko\'rish'}
    </button>`;
}

function checkAnswer(selectedId, correctId, btn){
  if(testAnswered) return;
  testAnswered=true;
  const isCorrect = selectedId===correctId;

  // Barcha tugmalarni o'chirish
  document.querySelectorAll('.test-opt').forEach(function(b){ b.disabled=true; });

  if(isCorrect){
    btn.classList.add('correct');
    testCorrect++;
  } else {
    btn.classList.add('wrong');
    testErrors++;
    // To'g'ri javobni ko'rsatish
    document.querySelectorAll('.test-opt').forEach(function(b){
      if(parseInt(b.getAttribute('onclick').match(/checkAnswer\((\d+)/)[1])===correctId){
        b.classList.add('show-correct');
      }
    });
  }

  // 2 ta xato bo'lsa — darhol fail
  if(testErrors>=2){
    setTimeout(function(){renderTestFail();},800);
    return;
  }

  // Xato indikatorini yangilash
  const errDots=document.querySelector('.test-error-info');
  if(errDots){
    let dots='';
    for(let i=0;i<2;i++){
      dots+=`<div class="test-error-dot${i<testErrors?'':' empty'}"></div>`;
    }
    errDots.innerHTML='Xato: '+dots+'<span style="margin-left:4px;color:var(--ink-soft)">(2 ta xatoda test o\'tkazib yuboriladi)</span>';
  }

  document.getElementById('testNextBtn').style.display='block';
}

function nextQuestion(){
  testIdx++;
  if(testIdx>=testWords.length){
    renderTestResult();
  } else {
    renderTestQuestion();
  }
}

function renderTestFail(){
  document.getElementById('testBody').innerHTML=`
    <div class="test-result">
      <div class="test-result-emoji">😔</div>
      <div class="test-result-title">Test o'tmadi</div>
      <div class="test-result-sub">2 ta xato qildingiz. Yana bir bor so'zlarni yaxshi o'rganib, qayta urining!</div>
      <div class="test-result-stats">
        <div class="trs"><div class="trs-val green">${testCorrect}</div><div class="trs-lbl">To'g'ri</div></div>
        <div class="trs"><div class="trs-val red">${testErrors}</div><div class="trs-lbl">Xato</div></div>
        <div class="trs"><div class="trs-val" style="color:var(--ink-mid)">${testIdx+1}</div><div class="trs-lbl">Savol</div></div>
      </div>
      <div class="test-result-btns">
        <button class="trb primary" onclick="startTest()">🔄 Qaytadan boshlash</button>
        <button class="trb secondary" onclick="closeTest()">So'zlarni takrorlash</button>
      </div>
    </div>`;
}

function renderTestResult(){
  const total  = testWords.length;
  const passed = testErrors<=MAX_ERRORS;

  if(passed && !isTopicPassed(currentTopic)){
    passedTopics.push(currentTopic);
    saveState();
    saveToFirestore();
  }

  const nextTopicIdx = TOPIC_ORDER.indexOf(currentTopic)+1;
  const nextTopic    = TOPIC_ORDER[nextTopicIdx];
  const hasNext      = !!nextTopic;

  if(passed){
    document.getElementById('testBody').innerHTML=`
      <div class="test-result">
        <div class="test-result-emoji">🏆</div>
        <div class="test-result-title">Tabriklaymiz!</div>
        <div class="test-result-sub">
          ${currentTopic} mavzusidan testni muvaffaqiyatli o'tdingiz!
          ${hasNext?('<br><br>🔓 <strong>'+nextTopic+'</strong> mavzusi ochildi!'):'<br><br>Barcha mavzularni tugatdingiz! 🎉'}
        </div>
        <div class="test-result-stats">
          <div class="trs"><div class="trs-val green">${testCorrect}</div><div class="trs-lbl">To'g'ri</div></div>
          <div class="trs"><div class="trs-val red">${testErrors}</div><div class="trs-lbl">Xato</div></div>
          <div class="trs"><div class="trs-val" style="color:var(--blue)">${Math.round(testCorrect/total*100)}%</div><div class="trs-lbl">Natija</div></div>
        </div>
        <div class="test-result-btns">
          ${hasNext?`<button class="trb green" onclick="closeTestGoNext('${nextTopic}')">➡ ${nextTopic} mavzusiga o'tish</button>`:''}
          <button class="trb secondary" onclick="closeTest();renderTopics()">Mavzular ro'yxatiga</button>
        </div>
      </div>`;
  } else {
    renderTestFail();
  }
}

function closeTestGoNext(topic){
  closeTest();
  renderTopics();
  setTimeout(function(){ openTopic(topic); },200);
}

// Storage sync
window.addEventListener('storage', function(e){
  if(e.key==='vz_learned'){ learnedIds=JSON.parse(e.newValue||'[]').map(Number); }
  if(e.key==='vz_passed') { passedTopics=JSON.parse(e.newValue||'[]'); }
});
</script>
</body>
