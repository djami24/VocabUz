<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --blue:#2196F3;
  --blue-light:#E3F2FD;
  --blue-mid:#BBDEFB;
  --ink:#1A1A2E;
  --ink-mid:#5A6070;
  --ink-soft:#9AA0AD;
  --white:#FFFFFF;
  --bg:#F0F6FF;
  --card-bg:#FFFFFF;
  --shadow-sm:0 1px 4px rgba(33,150,243,.10);
  --shadow-md:0 4px 16px rgba(33,150,243,.13);
  --radius:16px;
  --radius-sm:12px;
  --bottom-nav-h:66px;
}

html,body{height:100%;background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);}

/* ── TOP BAR ── */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--bg);
  padding:14px 16px 10px;
  display:flex;align-items:center;gap:10px;
}
.back-btn{
  width:38px;height:38px;border-radius:50%;
  background:var(--white);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);color:var(--ink-mid);
  flex-shrink:0;
}
.topbar-title{font-size:1.05rem;font-weight:700;flex:1;}
.topbar-count{
  font-size:.78rem;font-weight:600;
  background:var(--blue-light);color:var(--blue);
  padding:4px 10px;border-radius:20px;
}

/* ── TOPIC TABS ── */
.topic-tabs{
  display:flex;gap:8px;padding:0 16px 12px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.topic-tabs::-webkit-scrollbar{display:none;}
.tab-pill{
  flex-shrink:0;
  padding:7px 15px;border-radius:20px;
  font-size:.8rem;font-weight:600;
  background:var(--white);color:var(--ink-mid);
  border:none;cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition:background .15s,color .15s;
}
.tab-pill.active{background:var(--blue);color:#fff;}

/* ── WORD CARDS ── */
.words-list{
  padding:0 16px calc(var(--bottom-nav-h) + 24px);
  display:flex;flex-direction:column;gap:10px;
}

.word-card{
  background:var(--card-bg);
  border-radius:var(--radius);
  padding:14px 16px 12px;
  box-shadow:var(--shadow-sm);
  transition:box-shadow .15s;
}
.word-card:active{box-shadow:var(--shadow-md);}

.word-header{
  display:flex;align-items:baseline;gap:6px;
  margin-bottom:4px;
}
.word-num{
  font-size:.82rem;font-weight:700;color:var(--blue);
  flex-shrink:0;min-width:22px;
}
.word-en{
  font-size:.97rem;font-weight:700;color:var(--ink);
}
.word-dash{color:var(--ink-mid);font-size:.92rem;font-weight:400;}
.word-uz{
  font-size:.9rem;font-weight:500;color:var(--ink-mid);
  flex:1;
}
.word-arrow{
  margin-left:auto;color:var(--ink-soft);font-size:.95rem;flex-shrink:0;
}

.word-example{
  font-size:.84rem;color:var(--ink-mid);
  font-style:italic;line-height:1.5;
  padding:6px 0 8px 0;
  border-bottom:1px solid var(--blue-light);
  margin-bottom:8px;
}
.word-example::before{content:'• ';}

.word-actions{
  display:flex;gap:8px;align-items:center;
}
.action-btn{
  flex:1;height:38px;
  border-radius:var(--radius-sm);
  background:var(--bg);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-mid);
  transition:background .15s,color .15s;
  -webkit-tap-highlight-color:transparent;
}
.action-btn:active{background:var(--blue-light);}
.action-btn.bookmarked{color:var(--blue);}
.action-btn.liked{color:#E53935;}

/* ── LEVEL BADGE ── */
.level-badge{
  display:inline-flex;align-items:center;
  background:var(--blue-light);color:var(--blue);
  font-size:.68rem;font-weight:700;
  padding:2px 7px;border-radius:8px;
  margin-left:4px;vertical-align:middle;
}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  height:var(--bottom-nav-h);
  background:var(--white);
  display:flex;
  box-shadow:0 -1px 0 #e8eff8,0 -4px 16px rgba(33,150,243,.07);
  z-index:200;
}
.bottom-nav-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;
  color:var(--ink-soft);font-size:.65rem;font-weight:600;
  text-decoration:none;
  -webkit-tap-highlight-color:transparent;
}
.bottom-nav-item.is-active{color:var(--blue);}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:calc(var(--bottom-nav-h) + 16px);left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;
  padding:10px 20px;border-radius:24px;
  font-size:.83rem;font-weight:600;
  pointer-events:none;opacity:0;
  transition:opacity .25s,transform .25s;
  white-space:nowrap;z-index:300;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── SEARCH BAR ── */
.search-wrap{padding:0 16px 12px;}
.search-input{
  width:100%;height:42px;
  border-radius:var(--radius-sm);
  border:1.5px solid var(--blue-mid);
  background:var(--white);
  padding:0 14px 0 38px;
  font-size:.88rem;color:var(--ink);
  outline:none;font-family:inherit;
}
.search-wrap{position:relative;}
.search-icon{
  position:absolute;left:28px;top:50%;transform:translateY(-50%);
  color:var(--ink-soft);pointer-events:none;
}
</style>

// ── STATE ──────────────────────────────────────────────────
const bookmarks = JSON.parse(localStorage.getItem('vz_bookmarks') || '[]');
const likes     = JSON.parse(localStorage.getItem('vz_likes')     || '[]');
let activeTab   = 'Hammasi';
let searchQuery = '';

function saveBookmarks(){ localStorage.setItem('vz_bookmarks', JSON.stringify(bookmarks)); }
function saveLikes(){     localStorage.setItem('vz_likes',     JSON.stringify(likes));     }

// ── TOPICS ────────────────────────────────────────────────
const topics = ['Hammasi', ...new Set(ALL_WORDS.map(w => w.topic))];

function buildTabs(){
  const el = document.getElementById('topicTabs');
  el.innerHTML = topics.map(t =>
    `<button class="tab-pill${t===activeTab?' active':''}" onclick="switchTab('${t}')">${t}</button>`
  ).join('');
}

function switchTab(t){
  activeTab = t;
  buildTabs();
  renderWords();
}

// ── RENDER ─────────────────────────────────────────────────
function filteredWords(){
  let list = activeTab === 'Hammasi' ? ALL_WORDS : ALL_WORDS.filter(w => w.topic === activeTab);
  if(searchQuery){
    const q = searchQuery.toLowerCase();
    list = list.filter(w =>
      w.word.toLowerCase().includes(q) ||
      w.uz.toLowerCase().includes(q)
    );
  }
  return list;
}

function renderWords(){
  const list = filteredWords();
  document.getElementById('wordCount').textContent = list.length + ' ta so\'z';
  const el = document.getElementById('wordsList');
  if(!list.length){
    el.innerHTML = '<div style="text-align:center;padding:48px 0;color:var(--ink-soft);font-size:.9rem;">Hech narsa topilmadi</div>';
    return;
  }
  el.innerHTML = list.map((w, i) => {
    const isBookmarked = bookmarks.includes(w.id);
    const isLiked      = likes.includes(w.id);
    return `
    <div class="word-card" id="card-${w.id}">
      <div class="word-header">
        <span class="word-num">${i+1}.</span>
        <span class="word-en">${w.word}</span>
        <span class="word-dash"> – </span>
        <span class="word-uz">${w.uz}</span>
        <span class="level-badge">${w.level}</span>
        <span class="word-arrow">›</span>
      </div>
      ${w.example ? `<div class="word-example">${w.example}</div>` : ''}
      <div class="word-actions">
        <button class="action-btn" title="Ulashish" onclick="shareWord(${w.id})">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        </button>
        <button class="action-btn" title="Tinglash" onclick="speakWord('${w.word}')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
        <button class="action-btn${isBookmarked?' bookmarked':''}" title="Bookmark" id="bm-${w.id}" onclick="toggleBookmark(${w.id})">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="${isBookmarked?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>

// ── ACTIONS ────────────────────────────────────────────────
function toggleBookmark(id){
  const idx = bookmarks.indexOf(id);
  if(idx === -1){
    bookmarks.push(id);
    showToast('📚 Keyinchalik yodlash uchun saqlandi!');
  } else {
    bookmarks.splice(idx, 1);
    showToast('Bookmark olib tashlandi');
  }
  saveBookmarks();
  // Update button in-place
  const btn = document.getElementById('bm-' + id);
  if(btn){
    const isB = bookmarks.includes(id);
    btn.className = 'action-btn' + (isB?' bookmarked':'');
    btn.querySelector('svg').setAttribute('fill', isB ? 'currentColor' : 'none');
  }
}

function toggleLike(id){
  const idx = likes.indexOf(id);
  if(idx === -1){
    likes.push(id);
    showToast('❤️ Yoqtirganlarga qo\'shildi!');
  } else {
    likes.splice(idx, 1);
    showToast('Yoqtirganlardan olib tashlandi');
  }
  saveLikes();
  const btn = document.getElementById('lk-' + id);
  if(btn){
    const isL = likes.includes(id);
    btn.className = 'action-btn' + (isL?' liked':'');
    btn.querySelector('svg').setAttribute('fill', isL ? 'currentColor' : 'none');
  }
}

function speakWord(word){
  if('speechSynthesis' in window){
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US';
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }
}

function shareWord(id){
  const w = ALL_WORDS.find(x => x.id === id);
  if(!w) return;
  const text = `${w.word} — ${w.uz}\n\n"${w.example}"`;
  if(navigator.share){
    navigator.share({ text });
  } else {
    navigator.clipboard.writeText(text).then(()=>showToast('📋 Nusxalandi!'));
  }
}

let toastTimer;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
}

// ── SEARCH ─────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', function(){
  searchQuery = this.value.trim();
  renderWords();
});

// ── INIT ───────────────────────────────────────────────────
buildTabs();
renderWords();
</script>
